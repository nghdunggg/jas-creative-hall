<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Jasverine's Creative Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─────────────────────────────────────── */
:root{
  --bg:#2a1f1a;--bg2:#332621;--bg3:#291e19;
  --surface:#3e2f28;--surface2:#4a3830;--surface3:#574340;
  --text:#d8c8b8;--text-dim:#8a7a6a;--text-muted:#5a4e44;
  --accent:#c9a882;--accent2:#e2c49a;--accent-dim:#a07848;
  --danger:#c47a7a;--success:#7db880;
  --border:rgba(201,168,130,.12);--border2:rgba(201,168,130,.28);
  --shadow:0 6px 40px rgba(0,0,0,.5);
  --r:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.3;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.05'/%3E%3C/svg%3E");}

/* ─── HEADER ─────────────────────────────────────── */
header{text-align:center;padding:2rem 2rem .6rem;position:relative;z-index:1;}
.site-title{font-family:'Caveat',cursive;font-size:clamp(1.9rem,4vw,2.9rem);font-weight:700;color:var(--accent);letter-spacing:.05em;text-shadow:0 2px 24px rgba(201,168,130,.2);}

/* ─── NAV ────────────────────────────────────────── */
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:.35rem;padding:.6rem 1.5rem;
  position:sticky;top:0;z-index:100;background:rgba(42,31,26,.94);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);}
.np{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
  font-family:'Caveat',cursive;font-size:1rem;padding:.38rem 1.1rem;border-radius:99px;
  cursor:pointer;transition:all .18s;white-space:nowrap;line-height:1.4;}
.np:hover,.np.active{background:var(--surface3);color:var(--accent);border-color:var(--border2);}
.np.add-btn{background:var(--accent);color:var(--bg);font-weight:700;border-color:var(--accent);}
.np.add-btn:hover{background:var(--accent2);}

/* ─── APP SHELL ──────────────────────────────────── */
.app{display:grid;grid-template-columns:210px 1fr;max-width:1360px;margin:0 auto;padding:1.5rem 1.2rem;position:relative;z-index:1;gap:0;}
@media(max-width:820px){.app{grid-template-columns:1fr;}.sidebar{display:none;}}

/* ─── SIDEBAR ────────────────────────────────────── */
.sidebar{padding-right:1rem;}
.sidebar-inner{position:sticky;top:64px;}
.sb-label{font-family:'Caveat',cursive;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-muted);padding:.3rem .7rem;margin-bottom:.4rem;display:block;}
.cat-list{display:flex;flex-direction:column;gap:.15rem;margin-bottom:.8rem;}
.cat-btn{display:flex;align-items:center;justify-content:space-between;width:100%;
  background:transparent;border:none;border-radius:8px;padding:.5rem .8rem;
  cursor:pointer;font-family:'Caveat',cursive;font-size:1rem;color:var(--text-dim);
  transition:all .16s;text-align:left;}
.cat-btn:hover{background:var(--surface2);color:var(--text);}
.cat-btn.active{background:var(--surface2);color:var(--accent);}
.cat-btn-inner{display:flex;align-items:center;gap:.4rem;min-width:0;flex:1;}
.cat-btn-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cat-count{font-size:.72rem;background:var(--surface3);color:var(--text-dim);
  padding:.08rem .45rem;border-radius:99px;flex-shrink:0;line-height:1.6;}
.cat-add-btn{display:flex;align-items:center;gap:.4rem;width:100%;font-family:'Caveat',cursive;
  font-size:.92rem;color:var(--text-dim);background:transparent;
  border:1px dashed var(--border);border-radius:8px;padding:.42rem .8rem;cursor:pointer;
  transition:all .18s;margin-top:.3rem;}
.cat-add-btn:hover{color:var(--accent);border-color:var(--border2);}

/* ─── MAIN ───────────────────────────────────────── */
.main{}
.toolbar{display:flex;align-items:center;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;}
.search-wrap{flex:1;min-width:140px;position:relative;}
.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:99px;padding:.52rem 1rem .52rem 2.2rem;color:var(--text);
  font-family:'Cormorant Garamond',Georgia,serif;font-size:.97rem;outline:none;transition:border-color .18s;}
.search-wrap input:focus{border-color:var(--border2);}
.search-wrap::before{content:'⌕';position:absolute;left:.8rem;top:50%;transform:translateY(-50%);
  color:var(--text-dim);font-size:1.1rem;pointer-events:none;}
.sort-sel{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
  font-family:'Caveat',cursive;font-size:.95rem;padding:.45rem .75rem;border-radius:8px;
  outline:none;cursor:pointer;}
.sort-sel option{background:var(--surface2);}
.view-tog{display:flex;gap:.15rem;background:var(--surface);border-radius:8px;padding:.18rem;}
.vt{background:transparent;border:none;padding:.3rem .55rem;border-radius:6px;cursor:pointer;
  color:var(--text-dim);font-size:1rem;transition:all .16s;}
.vt.active,.vt:hover{background:var(--surface2);color:var(--accent);}

/* ─── SECTION HEADERS ────────────────────────────── */
.cat-section{margin-bottom:2rem;}
.cat-section-hd{font-family:'Caveat',cursive;font-size:1.2rem;color:var(--accent);
  margin-bottom:.8rem;padding-bottom:.45rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.4rem;}

/* ─── LIST VIEW ──────────────────────────────────── */
.list-view{display:flex;flex-direction:column;gap:.6rem;}
.idea-list-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:1rem 1.2rem;cursor:pointer;transition:all .2s;animation:fadeUp .32s ease both;
  text-decoration:none;color:inherit;display:flex;align-items:center;gap:1rem;position:relative;}
.idea-list-card:hover{background:var(--surface2);border-color:var(--border2);
  transform:translateX(3px);box-shadow:-3px 0 0 var(--accent);}
.list-thumb{width:56px;height:50px;border-radius:8px;object-fit:cover;flex-shrink:0;
  background:var(--surface2);border:1px solid var(--border);}
.list-thumb-ph{width:56px;height:50px;border-radius:8px;flex-shrink:0;background:var(--surface2);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;}
.list-body{flex:1;min-width:0;}
.list-title{font-size:1.1rem;font-style:italic;color:var(--accent);margin-bottom:.15rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-meta{font-size:.78rem;color:var(--text-dim);display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.2rem;}
.list-preview{font-size:.92rem;color:var(--text-dim);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.list-foot{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.3rem;}
.card-actions{display:flex;gap:.25rem;opacity:0;transition:opacity .18s;position:absolute;right:.8rem;top:50%;transform:translateY(-50%);}
.idea-list-card:hover .card-actions{opacity:1;}

/* ─── BLOCK VIEW ─────────────────────────────────── */
.block-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.9rem;}
.idea-block-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;cursor:pointer;transition:all .2s;animation:fadeUp .32s ease both;
  text-decoration:none;color:inherit;display:flex;flex-direction:column;position:relative;}
.idea-block-card:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:var(--shadow);}
.block-cover{width:100%;height:145px;object-fit:cover;display:block;}
.block-cover-ph{width:100%;height:145px;background:linear-gradient(135deg,var(--bg2),var(--surface2));
  display:flex;align-items:center;justify-content:center;font-size:2.4rem;}
.block-body{padding:.9rem 1rem;flex:1;display:flex;flex-direction:column;}
.block-title{font-size:1.05rem;font-style:italic;color:var(--accent);margin-bottom:.25rem;line-height:1.3;}
.block-meta{font-size:.75rem;color:var(--text-dim);margin-bottom:.35rem;}
.block-preview{font-size:.88rem;color:var(--text-dim);line-height:1.42;flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.block-foot{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.6rem;}
.block-card-actions{display:flex;gap:.25rem;position:absolute;top:.5rem;right:.5rem;opacity:0;transition:opacity .18s;}
.idea-block-card:hover .block-card-actions{opacity:1;}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* badges */
.badge{font-family:'Caveat',cursive;font-size:.7rem;padding:.1rem .5rem;border-radius:20px;border:1px solid var(--border);}
.badge-cat{background:var(--surface3);color:var(--accent);}
.badge-img{background:rgba(90,120,160,.18);color:#8ab0d0;}
.badge-ref{background:rgba(100,160,100,.15);color:#86c486;}

/* action buttons on cards */
.act-btn{background:rgba(42,31,26,.82);border:1px solid var(--border2);border-radius:6px;
  color:var(--text-dim);cursor:pointer;padding:.22rem .45rem;font-size:.8rem;
  line-height:1;transition:all .15s;backdrop-filter:blur(4px);}
.act-btn:hover{color:var(--accent);}
.act-btn.del:hover{color:var(--danger);}

.empty-state{text-align:center;padding:3rem 1rem;color:var(--text-dim);font-style:italic;font-size:1.05rem;}

/* ─── MODALS ─────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(12,8,5,.86);backdrop-filter:blur(7px);
  z-index:200;display:flex;align-items:flex-start;justify-content:center;
  padding:1rem;opacity:0;pointer-events:none;transition:opacity .25s;overflow-y:auto;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border-radius:18px;padding:1.8rem 2rem;width:100%;
  max-width:680px;border:1px solid var(--border);box-shadow:0 20px 80px rgba(0,0,0,.7);
  transform:translateY(18px);transition:transform .25s;margin:auto;}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-h{font-family:'Caveat',cursive;font-size:1.65rem;color:var(--accent);margin-bottom:1.2rem;
  display:flex;align-items:center;justify-content:space-between;}
.modal-close{background:transparent;border:none;color:var(--text-dim);cursor:pointer;
  font-size:1.1rem;padding:.2rem .4rem;border-radius:5px;transition:color .15s;}
.modal-close:hover{color:var(--accent);}

.field{margin-bottom:.9rem;}
.field label{display:block;font-family:'Caveat',cursive;font-size:.9rem;color:var(--text-dim);margin-bottom:.28rem;}
.finp{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:.6rem .9rem;color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;
  font-size:1.02rem;outline:none;transition:border-color .18s;}
.finp:focus{border-color:var(--border2);}
.finp[type=select],.finp select,select.finp{cursor:pointer;}
select.finp option{background:var(--surface2);}
textarea.finp{resize:vertical;min-height:100px;line-height:1.6;}

/* two-col grid in form */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
@media(max-width:500px){.form-row{grid-template-columns:1fr;}}

/* form section divider */
.fsec{margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--border);}
.fsec-title{font-family:'Caveat',cursive;font-size:1.05rem;color:var(--accent);
  margin-bottom:.7rem;display:flex;align-items:center;gap:.35rem;}

/* cover upload */
.cover-row{display:flex;gap:.5rem;align-items:stretch;}
.upload-label{display:inline-flex;align-items:center;gap:.3rem;font-family:'Caveat',cursive;
  font-size:.88rem;color:var(--text-dim);background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:.5rem .85rem;cursor:pointer;white-space:nowrap;transition:all .16s;flex-shrink:0;}
.upload-label:hover{color:var(--accent);border-color:var(--border2);}
.upload-label input{display:none;}
#f-cover-preview{display:none;width:100%;max-height:140px;object-fit:cover;
  border-radius:8px;border:1px solid var(--border);margin-top:.5rem;}

/* ─── NOTION EDITOR ──────────────────────────────── */
.ne-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.ne-body{min-height:130px;max-height:380px;overflow-y:auto;padding:.4rem .5rem;}
.ne-block{display:flex;align-items:flex-start;gap:.35rem;padding:.1rem 0;position:relative;group:true;}
.ne-type-icon{font-size:.72rem;color:var(--text-muted);font-family:'Caveat',cursive;
  padding:.12rem .38rem;background:var(--surface);border-radius:4px;flex-shrink:0;
  margin-top:.32rem;line-height:1.5;min-width:22px;text-align:center;}
.ne-inner{flex:1;min-width:0;}
.ne-ta{width:100%;background:transparent;border:none;outline:none;color:var(--text);
  font-family:'Cormorant Garamond',Georgia,serif;font-size:1.02rem;line-height:1.65;
  resize:none;padding:.22rem .35rem;border-radius:4px;transition:background .14s;}
.ne-ta:focus{background:rgba(201,168,130,.04);}
.ne-ta.h2-ta{font-size:1.22rem;font-weight:600;color:var(--accent);}
.ne-ta.quote-ta{font-style:italic;color:var(--text-dim);border-left:3px solid var(--accent-dim);padding-left:.6rem;border-radius:0;}
.ne-img-block{padding:.3rem .35rem;}
.ne-img-url-inp{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:.3rem .6rem;color:var(--text-dim);font-family:inherit;font-size:.88rem;outline:none;margin-bottom:.3rem;}
.ne-img-url-inp:focus{border-color:var(--border2);}
.ne-img-cap{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);
  padding:.2rem .35rem;color:var(--text-dim);font-family:inherit;font-size:.85rem;
  font-style:italic;outline:none;}
.ne-img-prev{width:100%;max-height:200px;object-fit:cover;border-radius:7px;
  border:1px solid var(--border);margin-bottom:.3rem;display:none;}
.ne-divider{height:1px;background:var(--border);margin:.5rem .35rem;border-radius:1px;}
.ne-del{opacity:0;background:transparent;border:none;color:var(--text-muted);cursor:pointer;
  font-size:.85rem;padding:.18rem .3rem;border-radius:4px;transition:all .14s;
  flex-shrink:0;margin-top:.25rem;}
.ne-block:hover .ne-del{opacity:.7;}
.ne-del:hover{opacity:1!important;color:var(--danger);}
/* toolbar */
.ne-toolbar{display:flex;gap:.28rem;flex-wrap:wrap;padding:.45rem .5rem;
  border-top:1px solid var(--border);background:rgba(0,0,0,.1);}
.ne-tb{display:inline-flex;align-items:center;gap:.25rem;font-family:'Caveat',cursive;
  font-size:.85rem;color:var(--text-dim);background:transparent;border:1px solid var(--border);
  border-radius:5px;padding:.22rem .6rem;cursor:pointer;transition:all .15s;line-height:1.4;}
.ne-tb:hover{color:var(--accent);border-color:var(--border2);background:var(--surface);}
.ne-tb input{display:none;}

/* ref rows */
.ref-rows{display:flex;flex-direction:column;gap:.45rem;margin-bottom:.45rem;}
.ref-row{background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:.55rem .75rem;display:flex;flex-direction:column;gap:.35rem;}
.ref-row-top{display:flex;gap:.4rem;align-items:center;}
.rr-inp{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:.38rem .65rem;color:var(--text);font-family:inherit;font-size:.9rem;outline:none;}
.rr-inp:focus{border-color:var(--border2);}
.rr-note{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);
  padding:.22rem .35rem;color:var(--text-dim);font-family:inherit;font-size:.85rem;
  font-style:italic;outline:none;}
.btn-icon{background:transparent;border:1px solid var(--border);border-radius:6px;
  color:var(--text-dim);cursor:pointer;padding:.28rem .5rem;font-size:.85rem;
  transition:all .15s;line-height:1;flex-shrink:0;}
.btn-icon:hover{background:var(--surface2);color:var(--danger);}
.btn-add-row{display:inline-flex;align-items:center;gap:.3rem;font-family:'Caveat',cursive;
  font-size:.9rem;color:var(--text-dim);background:transparent;
  border:1px dashed var(--border);border-radius:6px;padding:.32rem .8rem;
  cursor:pointer;transition:all .16s;}
.btn-add-row:hover{color:var(--accent);border-color:var(--border2);}

/* modal actions */
.modal-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.2rem;flex-wrap:wrap;}
.btn{font-family:'Caveat',cursive;font-size:1rem;padding:.5rem 1.4rem;border-radius:99px;
  border:1px solid var(--border);cursor:pointer;transition:all .18s;line-height:1.4;}
.btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700;}
.btn-primary:hover{background:var(--accent2);}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn-danger:hover{background:#d48888;}
.btn-ghost{background:transparent;color:var(--text-dim);}
.btn-ghost:hover{color:var(--text);background:var(--surface2);}

/* status + hints */
.hint-box{font-size:.85rem;color:var(--text-dim);line-height:1.55;margin-bottom:.9rem;
  padding:.7rem .9rem;background:var(--bg2);border-radius:7px;border-left:3px solid var(--accent);}
.hint-box a{color:var(--accent);}
.status-msg{padding:.6rem .9rem;border-radius:7px;font-family:'Caveat',cursive;font-size:.95rem;margin-top:.7rem;}
.status-msg.success{background:rgba(100,160,100,.13);color:var(--success);border:1px solid rgba(100,160,100,.2);}
.status-msg.error{background:rgba(180,100,100,.13);color:var(--danger);border:1px solid rgba(180,100,100,.2);}
.status-msg.loading{background:rgba(201,168,130,.08);color:var(--accent);border:1px solid var(--border);}

/* confirm dialog */
.confirm-modal .modal{max-width:400px;text-align:center;}
.confirm-modal p{font-size:1.05rem;line-height:1.6;color:var(--text-dim);margin:.5rem 0 1.2rem;}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px;}
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header><div class="site-title">Jasverine's Creative Hall</div></header>

<!-- ── NAV ── -->
<nav>
  <button class="np active" data-view="recent"      onclick="setView('recent',this)">Recent</button>
  <button class="np"        data-view="categorized" onclick="setView('categorized',this)">Categorized</button>
  <button class="np"        data-view="all"         onclick="setView('all',this)">View All</button>
  <button class="np add-btn" onclick="openAddModal()">＋ Add Idea</button>
  <button class="np"         onclick="openSettingsModal()">⚙ Settings</button>
</nav>

<!-- ── APP ── -->
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-inner">
      <span class="sb-label">Categories</span>
      <div class="cat-list" id="cat-list"></div>
      <button class="cat-add-btn" onclick="openCatModal()">＋ New category</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="toolbar">
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Search ideas…" oninput="renderIdeas()">
      </div>
      <select class="sort-sel" id="sort-sel" onchange="renderIdeas()">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="alpha">A → Z</option>
      </select>
      <div class="view-tog">
        <button class="vt active" id="vt-list"  onclick="setViewMode('list')"  title="List view">☰</button>
        <button class="vt"        id="vt-block" onclick="setViewMode('block')" title="Block view">▦</button>
      </div>
    </div>
    <div id="ideas-container" class="list-view"></div>
  </main>

</div><!-- .app -->

<!-- ══════════════════════════════════════════════════
     ADD / EDIT IDEA MODAL
═══════════════════════════════════════════════════ -->
<div class="modal-overlay" id="add-modal">
  <div class="modal" style="max-width:720px;">
    <div class="modal-h">
      <span id="modal-form-title">✦ New Idea</span>
      <button class="modal-close" onclick="closeModal('add-modal')">✕</button>
    </div>

    <div class="field">
      <label>Title *</label>
      <input class="finp" type="text" id="f-title" placeholder="What's this idea?">
    </div>

    <div class="form-row">
      <div class="field">
        <label>Category</label>
        <select class="finp" id="f-category"></select>
      </div>
      <div class="field">
        <label>Tags (comma separated)</label>
        <input class="finp" type="text" id="f-tags" placeholder="color, layout, ux…">
      </div>
    </div>

    <!-- Cover image -->
    <div class="field">

<!-- ══════════════════════════════════════════════════
     JAVASCRIPT
═══════════════════════════════════════════════════ -->
<script>
'use strict';

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
let allIdeas     = [];
let currentView  = 'recent';
let activeCat    = 'all';
let viewMode     = 'list';
let editingFile  = null;   // filename of idea being edited
let deleteTarget = null;   // {file, title} for pending delete

let categories = JSON.parse(localStorage.getItem('ch_cats') || 'null') || [
  {name:'Design',emoji:'🎨'},{name:'Data Science',emoji:'📊'},
  {name:'Retouching',emoji:'✨'},{name:'Mindset',emoji:'🧠'},
  {name:'General Topic',emoji:'📝'},{name:'Uncategorized',emoji:'📦'}
];
function saveCats(){ localStorage.setItem('ch_cats', JSON.stringify(categories)); }

// ═══════════════════════════════════
// GITHUB CONFIG
// ═══════════════════════════════════
function getCfg(){
  return {
    username: localStorage.getItem('gh_username')||'',
    repo:     localStorage.getItem('gh_repo')||'',
    branch:   localStorage.getItem('gh_branch')||'main',
    token:    localStorage.getItem('gh_token')||''
  };
}
function saveSettings(){
  localStorage.setItem('gh_username', document.getElementById('s-username').value.trim());
  localStorage.setItem('gh_repo',     document.getElementById('s-repo').value.trim());
  localStorage.setItem('gh_branch',   document.getElementById('s-branch').value.trim()||'main');
  localStorage.setItem('gh_token',    document.getElementById('s-token').value.trim());
  showStatus('settings-status','✓ Saved!','success');
  setTimeout(()=>closeModal('settings-modal'),1000);
}

// ═══════════════════════════════════
// LOAD & RENDER LOOP
// ═══════════════════════════════════
async function loadIdeas(){
  try{
    const r = await fetch('ideas/manifest.json?t='+Date.now());
    if(!r.ok) throw new Error();
    allIdeas = await r.json();
  } catch(e){ allIdeas=[]; }
  renderAll();
}

function renderAll(){ renderSidebar(); renderIdeas(); }

function setView(v, el){
  currentView = v; activeCat = 'all';
  document.querySelectorAll('.np[data-view]').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}
function setViewMode(m){
  viewMode = m;
  document.getElementById('vt-list').classList.toggle('active', m==='list');
  document.getElementById('vt-block').classList.toggle('active', m==='block');
  renderIdeas();
}
function setActiveCat(name){
  activeCat = name; renderSidebar(); renderIdeas();
}

// ═══════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════
function renderSidebar(){
  const counts = {};
  allIdeas.forEach(i=>{ counts[i.category]=(counts[i.category]||0)+1; });
  const cl = document.getElementById('cat-list');
  const all_btn = makeBtn('all', 'All ideas', '', allIdeas.length, activeCat==='all');
  cl.innerHTML = '';
  cl.appendChild(all_btn);
  categories.forEach(c=>{
    cl.appendChild(makeBtn(c.name, c.name, c.emoji||'', counts[c.name]||0, activeCat===c.name));
  });
  // also refresh select
  const sel = document.getElementById('f-category');
  if(sel){
    const cur = sel.value;
    sel.innerHTML = categories.map(c=>'<option value="'+xAttr(c.name)+'">'+(c.emoji||'')+' '+xTxt(c.name)+'</option>').join('');
    if(cur && categories.find(c=>c.name===cur)) sel.value=cur;
  }
}
function makeBtn(catKey, label, emoji, count, isActive){
  const btn = document.createElement('button');
  btn.className = 'cat-btn' + (isActive?' active':'');
  btn.onclick = ()=>setActiveCat(catKey);
  btn.innerHTML = '<span class="cat-btn-inner">'
    + (emoji?'<span>'+emoji+'</span>':'')
    + '<span class="cat-btn-name">'+xTxt(label)+'</span></span>'
    + '<span class="cat-count">'+count+'</span>';
  return btn;
}

// ═══════════════════════════════════
// IDEAS LIST / GRID
// ═══════════════════════════════════
function renderIdeas(){
  const container = document.getElementById('ideas-container');
  const q   = document.getElementById('search-input').value.toLowerCase();
  const srt = document.getElementById('sort-sel').value;

  let list = [...allIdeas];
  if(q) list = list.filter(i=>
    i.title.toLowerCase().includes(q)||
    (i.content||'').toLowerCase().includes(q)||
    (i.tags||[]).join(' ').toLowerCase().includes(q));
  if(activeCat!=='all') list = list.filter(i=>i.category===activeCat);

  if(srt==='date-desc') list.sort((a,b)=>new Date(b.date)-new Date(a.date));
  else if(srt==='date-asc') list.sort((a,b)=>new Date(a.date)-new Date(b.date));
  else list.sort((a,b)=>a.title.localeCompare(b.title));

  if(currentView==='recent') list = list.slice(0,10);

  container.className = viewMode==='list' ? 'list-view' : 'block-view';

  if(!list.length){
    container.innerHTML = '<div class="empty-state">No ideas here yet… add one ✦</div>';
    return;
  }

  if(currentView==='categorized'){
    const groups = {};
    list.forEach(i=>{
      const k = i.category||'Uncategorized';
      if(!groups[k]) groups[k]=[];
      groups[k].push(i);
    });
    container.innerHTML = '';
    Object.entries(groups).forEach(([cat,ideas])=>{
      const catObj = categories.find(c=>c.name===cat)||{emoji:'📦'};
      const sec = document.createElement('div');
      sec.className = 'cat-section';
      const hd = document.createElement('div');
      hd.className = 'cat-section-hd';
      hd.textContent = (catObj.emoji||'')+'  '+cat;
      const inner = document.createElement('div');
      inner.className = viewMode==='list' ? 'list-view' : 'block-view';
      ideas.forEach((idea,i)=>inner.appendChild(buildCard(idea,i)));
      sec.appendChild(hd);
      sec.appendChild(inner);
      container.appendChild(sec);
    });
  } else {
    container.innerHTML = '';
    list.forEach((idea,i)=>container.appendChild(buildCard(idea,i)));
  }
}

function buildCard(idea, i){
  const cover   = idea.cover||'';
  const catObj  = categories.find(c=>c.name===idea.category)||{emoji:'📝'};
  const badges  = badgesHtml(idea);
  const filePath= 'ideas/'+idea.file;

  if(viewMode==='list'){
    const a = document.createElement('a');
    a.className = 'idea-list-card';
    a.href      = filePath;
    a.style.animationDelay = (i*0.04)+'s';
    a.innerHTML = (cover
      ? '<img class="list-thumb" src="'+xAttr(cover)+'" alt="" loading="lazy">'
      : '<div class="list-thumb-ph">'+xTxt(catObj.emoji||'📝')+'</div>')
      + '<div class="list-body">'
        + '<div class="list-title">'+xTxt(idea.title)+'</div>'
        + '<div class="list-meta"><span>'+fmtDate(idea.date)+'</span></div>'
        + '<div class="list-preview">'+xTxt((idea.content||'').slice(0,130))+'</div>'
        + '<div class="list-foot">'+badges+'</div>'
      + '</div>'
      + '<div class="card-actions" onclick="event.preventDefault();event.stopPropagation();">'
        + '<button class="act-btn" title="Edit" onclick="openEditModal(\''+xAttr(idea.file)+'\')">✏</button>'
        + '<button class="act-btn del" title="Delete" onclick="askDelete(\''+xAttr(idea.file)+'\',\''+xAttr(idea.title)+'\')">🗑</button>'
      + '</div>';
    return a;
  } else {
    const a = document.createElement('a');
    a.className = 'idea-block-card';
    a.href      = filePath;
    a.style.animationDelay = (i*0.04)+'s';
    a.innerHTML = (cover
      ? '<img class="block-cover" src="'+xAttr(cover)+'" alt="" loading="lazy">'
      : '<div class="block-cover-ph">'+xTxt(catObj.emoji||'📝')+'</div>')
      + '<div class="block-body">'
        + '<div class="block-title">'+xTxt(idea.title)+'</div>'
        + '<div class="block-meta">'+fmtDate(idea.date)+'</div>'
        + '<div class="block-preview">'+xTxt((idea.content||'').slice(0,160))+'</div>'
        + '<div class="block-foot">'+badges+'</div>'
      + '</div>'
      + '<div class="block-card-actions" onclick="event.preventDefault();event.stopPropagation();">'
        + '<button class="act-btn" title="Edit" onclick="openEditModal(\''+xAttr(idea.file)+'\')">✏</button>'
        + '<button class="act-btn del" title="Delete" onclick="askDelete(\''+xAttr(idea.file)+'\',\''+xAttr(idea.title)+'\')">🗑</button>'
      + '</div>';
    return a;
  }
}

function badgesHtml(idea){
  return '<span class="badge badge-cat">'+xTxt(idea.category||'')+'</span>'
    +(idea.imageCount?'<span class="badge badge-img">🖼 '+idea.imageCount+'</span>':'')
    +(idea.refCount?'<span class="badge badge-ref">🔗 '+idea.refCount+'</span>':'');
}

// ═══════════════════════════════════
// NOTION EDITOR
// ═══════════════════════════════════
let _blockId = 0;
const _blocks = {}; // id -> {type, data}

function initEditor(prefill){
  // clear
  for(const k in _blocks) delete _blocks[k];
  _blockId = 0;
  const body = document.getElementById('ne-body');
  body.innerHTML = '';
  if(prefill && prefill.length){
    prefill.forEach(b=>addBlock(b.type, null, b));
  } else {
    addBlock('text');
  }
}

function addBlock(type, fileInput, prefill){
  const id = 'b'+ _blockId++;
  _blocks[id] = {type, data: prefill ? {...prefill} : {}};
  const wrap = document.createElement('div');
  wrap.className = 'ne-block';
  wrap.id = id;

  let inner = '';

  if(type==='text'){
    inner = '<span class="ne-type-icon">¶</span>'
      + '<div class="ne-inner"><textarea class="ne-ta" rows="1" placeholder="Write something…" '
      + 'oninput="resize(this);_blocks[\''+id+'\'].data.text=this.value" '
      + 'onkeydown="neKey(event,\''+id+'\')">'
      + (prefill?xTxt(prefill.text||''):'')+'</textarea></div>';
  } else if(type==='h2'){
    inner = '<span class="ne-type-icon">H</span>'
      + '<div class="ne-inner"><textarea class="ne-ta h2-ta" rows="1" placeholder="Heading…" '
      + 'oninput="resize(this);_blocks[\''+id+'\'].data.text=this.value" '
      + 'onkeydown="neKey(event,\''+id+'\')">'
      + (prefill?xTxt(prefill.text||''):'')+'</textarea></div>';
  } else if(type==='quote'){
    inner = '<span class="ne-type-icon">❝</span>'
      + '<div class="ne-inner"><textarea class="ne-ta quote-ta" rows="1" placeholder="Quote…" '
      + 'oninput="resize(this);_blocks[\''+id+'\'].data.text=this.value" '
      + 'onkeydown="neKey(event,\''+id+'\')">'
      + (prefill?xTxt(prefill.text||''):'')+'</textarea></div>';
  } else if(type==='divider'){
    inner = '<span class="ne-type-icon">—</span>'
      + '<div class="ne-inner"><div class="ne-divider"></div></div>';
  } else if(type==='img-url'){
    const existUrl = prefill?prefill.url||'':'';
    const existCap = prefill?prefill.caption||'':'';
    inner = '<span class="ne-type-icon">🖼</span>'
      + '<div class="ne-inner ne-img-block">'
      + (existUrl?'<img class="ne-img-prev" id="nip-'+id+'" src="'+xAttr(existUrl)+'" style="display:block;" alt="">':'<img class="ne-img-prev" id="nip-'+id+'" src="" alt="">')
      + '<input class="ne-img-url-inp" placeholder="Image URL https://…" value="'+xAttr(existUrl)+'" '
      + 'oninput="_blocks[\''+id+'\'].data.url=this.value;nipPreview(\''+id+'\',this.value)">'
      + '<input class="ne-img-cap" placeholder="Caption…" value="'+xAttr(existCap)+'" '
      + 'oninput="_blocks[\''+id+'\'].data.caption=this.value">'
      + '</div>';
  } else if(type==='img-upload'){
    const file = fileInput ? fileInput.files[0] : null;
    const existPath = prefill?prefill.uploadedPath||prefill.url||'':'';
    inner = '<span class="ne-type-icon">🖼</span>'
      + '<div class="ne-inner ne-img-block">'
      + '<img class="ne-img-prev" id="nip-'+id+'" src="'+xAttr(existPath)+'" '+(existPath?'style="display:block;"':'')+'alt="">'
      + '<input class="ne-img-cap" placeholder="Caption…" value="'+(prefill?xAttr(prefill.caption||''):'')+'" '
      + 'oninput="_blocks[\''+id+'\'].data.caption=this.value">'
      + '</div>';
    if(file){
      const rd = new FileReader();
      rd.onload = e=>{
        _blocks[id].data.b64   = e.target.result.split(',')[1];
        _blocks[id].data.fname = file.name;
        _blocks[id].data.previewSrc = e.target.result;
        const img = document.getElementById('nip-'+id);
        if(img){img.src=e.target.result;img.style.display='block';}
      };
      rd.readAsDataURL(file);
      if(fileInput) fileInput.value='';
    } else if(existPath){
      _blocks[id].data.uploadedPath = existPath;
    }
  }

  wrap.innerHTML = inner
    + '<button class="ne-del" onclick="delBlock(\''+id+'\')" title="Remove block">✕</button>';
  document.getElementById('ne-body').appendChild(wrap);

  // auto resize any textarea in block
  wrap.querySelectorAll('textarea').forEach(t=>{ setTimeout(()=>resize(t),0); });
}

function delBlock(id){
  const el = document.getElementById(id);
  if(el) el.remove();
  delete _blocks[id];
}

function nipPreview(id, url){
  const img = document.getElementById('nip-'+id);
  if(!img) return;
  img.src = url;
  img.style.display = url ? 'block' : 'none';
}

function resize(el){
  el.style.height = 'auto';
  el.style.height = el.scrollHeight+'px';
}

function neKey(e, id){
  if(e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    addBlock('text');
    const all = document.getElementById('ne-body').querySelectorAll('.ne-ta');
    if(all.length) all[all.length-1].focus();
  }
}

function collectBlocks(){
  const blocks = [];
  document.getElementById('ne-body').querySelectorAll('.ne-block').forEach(el=>{
    const id = el.id;
    const b  = _blocks[id];
    if(!b) return;
    const entry = {type:b.type, ...b.data};
    const ta  = el.querySelector('textarea');
    if(ta) entry.text = ta.value;
    const cap = el.querySelector('.ne-img-cap');
    if(cap) entry.caption = cap.value;
    const url = el.querySelector('.ne-img-url-inp');
    if(url) entry.url = url.value;
    blocks.push(entry);
  });
  return blocks;
}

function blocksToPreviewText(blocks){
  return blocks.filter(b=>b.text).map(b=>b.text).join(' ').slice(0,220);
}

function blocksToHtml(blocks){
  return blocks.map(b=>{
    if(b.type==='text')    return '<p class="idea-p">'+safeHtml(b.text||'').replace(/\n/g,'<br>')+'</p>';
    if(b.type==='h2')      return '<h2 class="idea-h2">'+safeHtml(b.text||'')+'</h2>';
    if(b.type==='quote')   return '<blockquote class="idea-quote">'+safeHtml(b.text||'')+'</blockquote>';
    if(b.type==='divider') return '<hr class="idea-hr">';
    if(b.type==='img-url'||b.type==='img-upload'){
      const src = b.uploadedPath||b.url||'';
      if(!src) return '';
      return '<figure class="idea-figure">'
        +'<img src="'+safeHtml(src)+'" alt="'+safeHtml(b.caption||'')+'" class="idea-img" onclick="openLb(\''+safeHtml(src)+'\')">'
        +(b.caption?'<figcaption>'+safeHtml(b.caption)+'</figcaption>':'')
        +'</figure>';
    }
    return '';
  }).join('\n');
}

// ═══════════════════════════════════
// REF ROWS
// ═══════════════════════════════════
let _rrid = 0;
function addRefRow(prefill){
  const id = 'rr'+ _rrid++;
  const div = document.createElement('div');
  div.className = 'ref-row';
  div.id = id;
  div.innerHTML =
    '<div class="ref-row-top">'
    +'<input class="rr-inp rr-label" placeholder="Label (e.g. Dribbble inspo)" value="'+(prefill?xAttr(prefill.label||''):'') +'">'
    +'<input class="rr-inp rr-url" type="url" placeholder="https://…" value="'+(prefill?xAttr(prefill.url||''):'')+'">'
    +'<button class="btn-icon" onclick="document.getElementById(\''+id+'\').remove()" title="Remove">✕</button>'
    +'</div>'
    +'<input class="rr-note" placeholder="Note… (optional)" value="'+(prefill?xAttr(prefill.note||''): '')+'">';
  document.getElementById('ref-rows').appendChild(div);
}
function collectRefs(){
  const refs=[];
  document.getElementById('ref-rows').querySelectorAll('.ref-row').forEach(row=>{
    const label = row.querySelector('.rr-label').value.trim();
    const url   = row.querySelector('.rr-url').value.trim();
    const note  = row.querySelector('.rr-note').value.trim();
    if(url) refs.push({label:label||url,url,note});
  });
  return refs;
}

// ═══════════════════════════════════
// COVER IMAGE HANDLERS
// ═══════════════════════════════════
function previewCoverUrl(url){
  document.getElementById('f-cover-b64').value='';
  document.getElementById('f-cover-fname').value='';
  const img = document.getElementById('f-cover-preview');
  img.src = url;
  img.style.display = url ? 'block' : 'none';
}
function handleCoverUpload(input){
  const file = input.files[0];
  if(!file) return;
  const rd = new FileReader();
  rd.onload = e=>{
    document.getElementById('f-cover-b64').value   = e.target.result.split(',')[1];
    document.getElementById('f-cover-fname').value = file.name;
    document.getElementById('f-cover-url').value   = '';
    const img = document.getElementById('f-cover-preview');
    img.src = e.target.result;
    img.style.display = 'block';
  };
  rd.readAsDataURL(file);
}

// ═══════════════════════════════════
// MODAL OPEN / CLOSE
// ═══════════════════════════════════
function openAddModal(){
  const cfg = getCfg();
  if(!cfg.token||!cfg.username||!cfg.repo){
    openSettingsModal();
    showStatus('settings-status','Please fill in GitHub settings first.','error');
    return;
  }
  editingFile = null;
  document.getElementById('modal-form-title').textContent = '✦ New Idea';
  document.getElementById('submit-btn').textContent       = 'Save to GitHub';
  resetForm();
  document.getElementById('add-modal').classList.add('open');
}

function openEditModal(filename){
  const cfg = getCfg();
  if(!cfg.token||!cfg.username||!cfg.repo){
    openSettingsModal();
    showStatus('settings-status','Please fill in GitHub settings first.','error');
    return;
  }
  const idea = allIdeas.find(i=>i.file===filename);
  if(!idea){ alert('Idea not found in manifest.'); return; }
  editingFile = filename;
  document.getElementById('modal-form-title').textContent = '✎ Edit Idea';
  document.getElementById('submit-btn').textContent       = 'Update on GitHub';
  resetForm();

  // prefill basic fields
  document.getElementById('f-title').value = idea.title||'';
  document.getElementById('f-tags').value  = (idea.tags||[]).join(', ');

  // prefill category
  renderSidebar(); // ensures select is up-to-date
  const sel = document.getElementById('f-category');
  if(idea.category) sel.value = idea.category;

  // prefill cover
  if(idea.cover){
    document.getElementById('f-cover-url').value = idea.cover;
    const img = document.getElementById('f-cover-preview');
    img.src = idea.cover;
    img.style.display = 'block';
  }

  // prefill blocks from stored data
  const blocks = idea.blocks||[];
  if(blocks.length){
    initEditor(blocks);
  } else if(idea.content){
    // legacy: content is plain text — put in one text block
    initEditor([{type:'text',text:idea.content}]);
  } else {
    initEditor();
  }

  // prefill refs
  (idea.refs||[]).forEach(r=>addRefRow(r));

  document.getElementById('add-status').textContent='';
  document.getElementById('add-modal').classList.add('open');
}

function resetForm(){
  ['f-title','f-tags','f-cover-url','f-cover-b64','f-cover-fname'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('f-cover-preview').style.display='none';
  document.getElementById('ref-rows').innerHTML='';
  document.getElementById('add-status').textContent='';
  document.getElementById('add-status').className='';
  initEditor();
}

function openSettingsModal(){
  const cfg=getCfg();
  document.getElementById('s-username').value=cfg.username;
  document.getElementById('s-repo').value=cfg.repo;
  document.getElementById('s-branch').value=cfg.branch;
  document.getElementById('s-token').value=cfg.token;
  document.getElementById('settings-modal').classList.add('open');
}

  document.getElementById('cat-emoji-inp').value='';

}
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

// close on backdrop click
document.querySelectorAll('.modal-overlay').forEach(m=>{
  m.addEventListener('click', e=>{ if(e.target===m) closeModal(m.id); });
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.querySelectorAll('.modal-overlay.open').forEach(m=>closeModal(m.id)); });

function showStatus(id,msg,type){
  const el=document.getElementById(id);
  if(!el) return;
  el.className='status-msg '+type;

function saveNewCategory(){
  const name  = document.getElementById('cat-name-inp').value.trim();
  const emoji = document.getElementById('cat-emoji-inp').value.trim()||'📝';
  if(!name) return;
  if(!categories.find(c=>c.name===name)){
    categories.push({name,emoji});
    saveCats();
    renderSidebar();
  }
  closeModal('cat-modal');

// DELETE
// ═══════════════════════════════════
function askDelete(filename, title){
  deleteTarget = {file:filename, title};
  document.getElementById('confirm-msg').textContent =
    'Delete "'+title+'"? This cannot be undone.';
  document.getElementById('confirm-status').textContent='';
  document.getElementById('confirm-modal').classList.add('open');
}

async function confirmDelete(){
  if(!deleteTarget) return;
  const cfg = getCfg();
  if(!cfg.token){ showStatus('confirm-status','GitHub not configured.','error'); return; }
  showStatus('confirm-status','Deleting…','loading');
  try{
    // delete html file
    await ghDelete(cfg, 'ideas/'+deleteTarget.file);
    // update manifest
    const newManifest = allIdeas.filter(i=>i.file!==deleteTarget.file);
    await ghPut(cfg, 'ideas/manifest.json', toB64(JSON.stringify(newManifest,null,2)));
    allIdeas = newManifest;
    deleteTarget = null;
    closeModal('confirm-modal');
    renderAll();
  } catch(err){
    showStatus('confirm-status','Error: '+err.message,'error');
  }
}

// ═══════════════════════════════════
// SUBMIT (ADD + EDIT)
// ═══════════════════════════════════
async function submitIdea(){
  const title   = document.getElementById('f-title').value.trim();
  const cat     = document.getElementById('f-category').value;
  const tagsRaw = document.getElementById('f-tags').value.trim();
  const blocks  = collectBlocks();

  if(!title){ showStatus('add-status','Title is required.','error'); return; }

  const tags  = tagsRaw ? tagsRaw.split(',').map(t=>t.trim()).filter(Boolean) : [];
  const cfg   = getCfg();
  const isEdit= !!editingFile;

  // preserve original date if editing
  const originalIdea = isEdit ? allIdeas.find(i=>i.file===editingFile) : null;
  const date  = isEdit && originalIdea ? originalIdea.date : new Date().toISOString();

  const slug  = title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const ts    = Date.now();
  const filename = isEdit ? editingFile : slug+'-'+ts+'.html';

  showStatus('add-status','Working…','loading');
  try{
    // 1. Cover
    let coverPath = '';
    const covB64   = document.getElementById('f-cover-b64').value;
    const covFname = document.getElementById('f-cover-fname').value;
    const covUrl   = document.getElementById('f-cover-url').value.trim();
    if(covB64 && covFname){
      const ext   = covFname.split('.').pop();
      const cname = 'cover-'+slug+'-'+ts+'.'+ext;
      showStatus('add-status','Uploading cover…','loading');
      await ghPut(cfg, 'ideas/images/'+cname, covB64);
      coverPath = 'images/'+cname;
    } else {
      coverPath = covUrl;
    }
    // if editing and no new cover given, keep original
    if(!coverPath && isEdit && originalIdea) coverPath = originalIdea.cover||'';

    // 2. Upload block images
    for(const b of blocks){
      if((b.type==='img-upload') && b.b64 && b.fname){
        showStatus('add-status','Uploading image…','loading');
        const ext   = b.fname.split('.').pop();
        const iname = 'img-'+slug+'-'+ts+'-'+Math.random().toString(36).slice(2,5)+'.'+ext;
        await ghPut(cfg, 'ideas/images/'+iname, b.b64);
        b.uploadedPath = 'images/'+iname;
        delete b.b64; delete b.fname;
      }
    }

    // 3. Refs
    const refs = collectRefs();

    // 4. Build page HTML
    const contentHtml    = blocksToHtml(blocks);
    const contentPreview = blocksToPreviewText(blocks);
    const tagsHtml       = tags.map(t=>'<span class="tag">'+safeHtml(t)+'</span>').join('');
    const refsHtml       = buildRefsHtml(refs);
    const imgCount       = blocks.filter(b=>b.type==='img-url'||b.type==='img-upload').length;

    const ideaPageHtml = buildIdeaPage({title,cat,date,contentHtml,tagsHtml,refsHtml,coverPath});

    // 5. Commit
    showStatus('add-status','Committing…','loading');
    await ghPut(cfg, 'ideas/'+filename, toB64(ideaPageHtml));

    // 6. Update manifest (store blocks + refs for re-editing)
    const entry = {
      title, category:cat, content:contentPreview, tags,
      date, file:filename, cover:coverPath,
      imageCount:imgCount, refCount:refs.length,
      blocks, refs  // stored for edit prefill
    };
    let newManifest;
    if(isEdit){
      newManifest = allIdeas.map(i=>i.file===filename ? entry : i);
    } else {
      newManifest = [entry, ...allIdeas];
    }
    await ghPut(cfg, 'ideas/manifest.json', toB64(JSON.stringify(newManifest,null,2)));

    allIdeas = newManifest;
    renderAll();
    showStatus('add-status','✓ '+(isEdit?'Updated':'Saved')+'! GitHub Pages will refresh shortly.','success');
    setTimeout(()=>closeModal('add-modal'),2000);

  } catch(err){
    console.error(err);
    showStatus('add-status','Error: '+err.message,'error');
  }
}

// ═══════════════════════════════════
// BUILD REFS HTML SNIPPET
// ═══════════════════════════════════
function buildRefsHtml(refs){
  if(!refs.length) return '';
  const ICONS = {'github':'🐙','figma':'🎨','dribbble':'🏀','youtube':'▶️','notion':'📓','pinterest':'📌','behance':'🅱','medium':'✍️','twitter':'🐦','x.com':'🐦'};
  const items = refs.map(r=>{
    let icon='🔗';
    try{ const h=new URL(r.url).hostname; for(const[k,v] of Object.entries(ICONS)){if(h.includes(k)){icon=v;break;}} }catch(e){}
    return '<a class="ref-item" href="'+safeHtml(r.url)+'" target="_blank" rel="noopener">'
      +'<div class="ref-icon">'+icon+'</div>'
      +'<div class="ref-body">'
        +'<div class="ref-label">'+safeHtml(r.label)+'</div>'
        +'<div class="ref-url">'+safeHtml(r.url)+'</div>'
        +(r.note?'<div class="ref-note">'+safeHtml(r.note)+'</div>':'')
      +'</div></a>';
  }).join('');
  return '<div class="section-card"><div class="section-title">🔗 References</div>'
    +'<div class="ref-list">'+items+'</div></div>';
}

// ═══════════════════════════════════
// GITHUB API
// ═══════════════════════════════════
async function ghPut(cfg, path, b64content){
  const url = 'https://api.github.com/repos/'+cfg.username+'/'+cfg.repo+'/contents/'+path;
  let sha = null;
  try{
    const r = await fetch(url, {headers:{'Authorization':'token '+cfg.token,'Accept':'application/vnd.github.v3+json'}});
    if(r.ok){ const d=await r.json(); sha=d.sha; }
  } catch(e){}
  const body = {message:'Update '+path, content:b64content, branch:cfg.branch};
  if(sha) body.sha = sha;
  const res = await fetch(url, {
    method:'PUT',
    headers:{'Authorization':'token '+cfg.token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!res.ok){ const e=await res.json(); throw new Error(e.message||'GitHub API error'); }
  return res.json();
}

async function ghDelete(cfg, path){
  const url = 'https://api.github.com/repos/'+cfg.username+'/'+cfg.repo+'/contents/'+path;
  let sha = null;
  try{
    const r = await fetch(url, {headers:{'Authorization':'token '+cfg.token,'Accept':'application/vnd.github.v3+json'}});
    if(r.ok){ const d=await r.json(); sha=d.sha; }
  } catch(e){}
  if(!sha) return; // file might not exist
  const res = await fetch(url, {
    method:'DELETE',
    headers:{'Authorization':'token '+cfg.token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({message:'Delete '+path, sha, branch:cfg.branch})
  });
  if(!res.ok){ const e=await res.json(); throw new Error(e.message||'GitHub delete error'); }
}

// ═══════════════════════════════════
// UTILS
// ═══════════════════════════════════
function safeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;'); }
function xTxt(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function xAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;'); }
function toB64(str){ return btoa(unescape(encodeURIComponent(str))); }
function fmtDate(d){ if(!d)return''; return new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }
