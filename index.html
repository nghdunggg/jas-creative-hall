<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Jasverine's Creative Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2a1f1a;--bg2:#332621;--surface:#3e2f28;
  --surface2:#4a3830;--surface3:#57433a;
  --text:#d8c8b8;--text-dim:#8a7a6a;
  --accent:#c9a882;--accent2:#e2c49a;--accent3:#a07848;
  --danger:#b87070;--success:#7db87d;
  --border:rgba(201,168,130,0.13);--border2:rgba(201,168,130,0.28);
  --shadow:0 8px 48px rgba(0,0,0,0.5);
  --r:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.05'/%3E%3C/svg%3E");}

/* ── HEADER ── */
header{text-align:center;padding:2.2rem 2rem .8rem;position:relative;z-index:1;}
.site-title{font-family:'Caveat',cursive;font-size:clamp(2rem,5vw,3rem);font-weight:700;color:var(--accent);letter-spacing:.05em;text-shadow:0 2px 24px rgba(201,168,130,.25);}

/* ── NAV ── */
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem;padding:.7rem 1.5rem;position:sticky;top:0;z-index:100;
  background:rgba(42,31,26,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);}
.np{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);font-family:'Caveat',cursive;font-size:1.05rem;
  padding:.4rem 1.2rem;border-radius:99px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.np:hover,.np.active{background:var(--surface3);color:var(--accent);border-color:var(--border2);}
.np.add{background:var(--accent);color:var(--bg);font-weight:700;border-color:var(--accent);}
.np.add:hover{background:var(--accent2);}

/* ── LAYOUT ── */
.app{display:grid;grid-template-columns:220px 1fr;gap:0;max-width:1340px;margin:0 auto;padding:1.6rem 1.4rem;position:relative;z-index:1;}
@media(max-width:860px){.app{grid-template-columns:1fr;}.sidebar{display:none;}}

/* ── SIDEBAR ── */
.sidebar{padding-right:1.2rem;}
.sidebar-inner{position:sticky;top:72px;}
.sb-title{font-family:'Caveat',cursive;font-size:1.1rem;color:var(--text-dim);margin-bottom:.7rem;padding:.4rem .6rem;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;}
.cat-list{display:flex;flex-direction:column;gap:.3rem;margin-bottom:1rem;}
.cat-item{display:flex;align-items:center;justify-content:space-between;
  background:transparent;border:none;border-radius:8px;padding:.55rem .9rem;
  cursor:pointer;font-family:'Caveat',cursive;font-size:1.05rem;color:var(--text-dim);
  transition:all .18s;text-align:left;width:100%;}
.cat-item:hover{background:var(--surface2);color:var(--text);}
.cat-item.active{background:var(--surface2);color:var(--accent);}
.cat-count{font-size:.78rem;background:var(--surface3);color:var(--text-dim);padding:.1rem .5rem;border-radius:99px;}
.cat-add-btn{width:100%;display:flex;align-items:center;gap:.4rem;font-family:'Caveat',cursive;font-size:.95rem;
  color:var(--text-dim);background:transparent;border:1px dashed var(--border);border-radius:8px;
  padding:.45rem .9rem;cursor:pointer;transition:all .2s;margin-top:.3rem;}
.cat-add-btn:hover{color:var(--accent);border-color:var(--border2);}

/* ── MAIN CONTENT ── */
.main{}
.toolbar{display:flex;align-items:center;gap:.6rem;margin-bottom:1.1rem;flex-wrap:wrap;}
.search-wrap{flex:1;min-width:160px;position:relative;}
.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:99px;
  padding:.58rem 1.1rem .58rem 2.4rem;color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;
  font-size:1rem;outline:none;transition:border-color .2s;}
.search-wrap input:focus{border-color:var(--border2);}
.search-wrap::before{content:'⌕';position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:1.15rem;}
.sort-select{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
  font-family:'Caveat',cursive;font-size:1rem;padding:.48rem .8rem;border-radius:8px;outline:none;cursor:pointer;}
.sort-select option{background:var(--surface2);}
.view-toggle{display:flex;gap:.2rem;background:var(--surface);border-radius:8px;padding:.2rem;}
.vt{background:transparent;border:none;padding:.32rem .6rem;border-radius:6px;cursor:pointer;color:var(--text-dim);font-size:1.1rem;transition:all .18s;}
.vt.active,.vt:hover{background:var(--surface2);color:var(--accent);}

/* ── SECTION HEADERS (categorized view) ── */
.cat-section{margin-bottom:2.2rem;}
.cat-section-header{font-family:'Caveat',cursive;font-size:1.3rem;color:var(--accent);
  margin-bottom:.9rem;padding-bottom:.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem;}

/* ── LIST VIEW ── */
#ideas-container.list-view{display:flex;flex-direction:column;gap:.7rem;}
.idea-list-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:1.1rem 1.4rem;cursor:pointer;transition:all .22s ease;
  animation:fadeUp .35s ease both;text-decoration:none;color:inherit;display:flex;align-items:center;gap:1.1rem;}
.idea-list-card:hover{background:var(--surface2);border-color:var(--border2);transform:translateX(3px);box-shadow:-3px 0 0 var(--accent);}
.list-thumb{width:58px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--surface2);border:1px solid var(--border);}
.list-thumb-placeholder{width:58px;height:52px;border-radius:8px;flex-shrink:0;background:var(--surface2);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--text-dim);}
.list-body{flex:1;min-width:0;}
.list-title{font-size:1.15rem;font-style:italic;color:var(--accent);margin-bottom:.18rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-meta{font-size:.82rem;color:var(--text-dim);display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.25rem;}
.list-preview{font-size:.95rem;color:var(--text-dim);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.list-badges{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.3rem;}

/* ── BLOCK VIEW ── */
#ideas-container.block-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem;}
.idea-block-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;cursor:pointer;transition:all .22s ease;
  animation:fadeUp .35s ease both;text-decoration:none;color:inherit;display:flex;flex-direction:column;}
.idea-block-card:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.4);}
.block-cover{width:100%;height:155px;object-fit:cover;background:var(--surface2);display:block;}
.block-cover-placeholder{width:100%;height:155px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:var(--text-dim);}
.block-body{padding:1rem 1.1rem;flex:1;display:flex;flex-direction:column;}
.block-title{font-size:1.12rem;font-style:italic;color:var(--accent);margin-bottom:.35rem;line-height:1.3;}
.block-meta{font-size:.78rem;color:var(--text-dim);margin-bottom:.4rem;}
.block-preview{font-size:.9rem;color:var(--text-dim);line-height:1.45;flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.block-badges{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.7rem;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* badges */
.badge{font-family:'Caveat',cursive;font-size:.73rem;padding:.12rem .55rem;border-radius:20px;border:1px solid var(--border);}
.badge-cat{background:var(--surface3);color:var(--accent);}
.badge-img{background:rgba(90,120,160,.18);color:#8ab0d0;}
.badge-ref{background:rgba(100,160,100,.15);color:#90c890;}

.empty-state{text-align:center;padding:3.5rem 1rem;color:var(--text-dim);font-style:italic;font-size:1.1rem;}

/* ── MODAL base ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,10,7,.85);backdrop-filter:blur(7px);
  z-index:200;display:flex;align-items:flex-start;justify-content:center;
  padding:1rem;opacity:0;pointer-events:none;transition:opacity .28s;overflow-y:auto;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border-radius:20px;padding:2rem 2.2rem;width:100%;
  max-width:700px;border:1px solid var(--border);box-shadow:0 20px 80px rgba(0,0,0,.65);
  transform:translateY(20px);transition:transform .28s;margin:auto;}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-h{font-family:'Caveat',cursive;font-size:1.75rem;color:var(--accent);margin-bottom:1.4rem;}

.field{margin-bottom:1rem;}
.field label{display:block;font-family:'Caveat',cursive;font-size:.95rem;color:var(--text-dim);margin-bottom:.3rem;}
.field input,.field textarea,.field select{
  width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:9px;
  padding:.65rem .95rem;color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;
  font-size:1.05rem;outline:none;transition:border-color .2s;resize:vertical;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--border2);}
.field select option{background:var(--surface2);}

/* form section */
.fsec{margin-top:1.3rem;padding-top:1.1rem;border-top:1px solid var(--border);}
.fsec-title{font-family:'Caveat',cursive;font-size:1.1rem;color:var(--accent);margin-bottom:.75rem;display:flex;align-items:center;gap:.4rem;}

/* notion-like editor */
.notion-editor{background:var(--bg2);border:1px solid var(--border);border-radius:9px;min-height:160px;max-height:420px;overflow-y:auto;padding:.5rem;}
.ne-block{display:flex;align-items:flex-start;gap:.4rem;padding:.15rem 0;position:relative;}
.ne-block:hover .ne-drag{opacity:.6;}
.ne-drag{opacity:0;cursor:grab;color:var(--text-dim);padding:.3rem .2rem;font-size:.9rem;transition:opacity .15s;flex-shrink:0;margin-top:.15rem;}
.ne-content{flex:1;min-width:0;}
.ne-text{width:100%;background:transparent;border:none;outline:none;color:var(--text);
  font-family:'Cormorant Garamond',Georgia,serif;font-size:1.05rem;line-height:1.65;
  resize:none;padding:.25rem .4rem;border-radius:5px;transition:background .15s;}
.ne-text:focus{background:rgba(201,168,130,.05);}
.ne-img-preview{width:100%;max-height:220px;object-fit:cover;border-radius:8px;border:1px solid var(--border);margin:.2rem 0;display:block;}
.ne-img-url{width:100%;font-size:.88rem;padding:.3rem .6rem;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text-dim);outline:none;margin-top:.25rem;}
.ne-img-url:focus{border-color:var(--border2);}
.ne-img-caption{width:100%;font-size:.85rem;font-style:italic;padding:.2rem .5rem;
  background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text-dim);outline:none;margin-top:.15rem;}
.ne-block-type{font-size:.75rem;color:var(--text-dim);font-family:'Caveat',cursive;padding:.1rem .4rem;
  background:var(--surface);border-radius:4px;white-space:nowrap;flex-shrink:0;margin-top:.35rem;}
.ne-remove{opacity:0;background:transparent;border:none;color:var(--text-dim);cursor:pointer;
  font-size:.9rem;padding:.2rem .35rem;border-radius:5px;transition:all .15s;flex-shrink:0;margin-top:.22rem;}
.ne-block:hover .ne-remove{opacity:.6;}
.ne-remove:hover{opacity:1!important;color:var(--danger);}
.ne-toolbar{display:flex;gap:.35rem;flex-wrap:wrap;padding:.5rem .4rem .2rem;border-top:1px solid var(--border);margin-top:.3rem;}
.ne-tb-btn{display:inline-flex;align-items:center;gap:.3rem;font-family:'Caveat',cursive;font-size:.9rem;
  color:var(--text-dim);background:transparent;border:1px solid var(--border);border-radius:6px;
  padding:.28rem .7rem;cursor:pointer;transition:all .18s;}
.ne-tb-btn:hover{color:var(--accent);border-color:var(--border2);background:var(--surface);}
.ne-tb-btn input{display:none;}

/* ref rows */
.ref-rows{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.5rem;}
.ref-row{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:.6rem .8rem;display:flex;flex-direction:column;gap:.4rem;position:relative;}
.ref-row-main{display:flex;gap:.5rem;}
.ref-row-main input{flex:1;padding:.45rem .7rem;font-size:.92rem;}
.ref-note-inp{font-size:.88rem;padding:.35rem .7rem;font-style:italic;color:var(--text-dim);}
.btn-icon{background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--text-dim);
  cursor:pointer;padding:.32rem .55rem;font-size:.9rem;transition:all .18s;line-height:1;flex-shrink:0;}
.btn-icon:hover{background:var(--surface2);color:var(--danger);}
.btn-add-row{display:inline-flex;align-items:center;gap:.35rem;font-family:'Caveat',cursive;font-size:.95rem;
  color:var(--text-dim);background:transparent;border:1px dashed var(--border);border-radius:7px;
  padding:.35rem .85rem;cursor:pointer;transition:all .18s;}
.btn-add-row:hover{color:var(--accent);border-color:var(--border2);}

.modal-actions{display:flex;gap:.7rem;justify-content:flex-end;margin-top:1.3rem;flex-wrap:wrap;}
.btn{font-family:'Caveat',cursive;font-size:1.05rem;padding:.55rem 1.5rem;border-radius:99px;border:1px solid var(--border);cursor:pointer;transition:all .2s;}
.btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700;}
.btn-primary:hover{background:var(--accent2);}
.btn-ghost{background:transparent;color:var(--text-dim);}
.btn-ghost:hover{color:var(--text);background:var(--surface2);}
.btn-sm{font-size:.9rem;padding:.35rem 1rem;}

.hint-box{font-size:.88rem;color:var(--text-dim);line-height:1.55;margin-bottom:1rem;padding:.75rem .95rem;
  background:var(--bg2);border-radius:8px;border-left:3px solid var(--accent);}
.hint-box a{color:var(--accent);}
.status-msg{padding:.7rem .95rem;border-radius:8px;font-family:'Caveat',cursive;font-size:.98rem;margin-top:.75rem;}
.status-msg.success{background:rgba(100,160,100,.13);color:var(--success);border:1px solid rgba(100,160,100,.2);}
.status-msg.error{background:rgba(180,100,100,.13);color:var(--danger);border:1px solid rgba(180,100,100,.2);}
.status-msg.loading{background:rgba(201,168,130,.09);color:var(--accent);border:1px solid var(--border);}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px;}
</style>
</head>
<body>

<header><div class="site-title">Jasverine's Creative Hall</div></header>

<nav>
  <button class="np active" data-view="recent"   onclick="setView('recent',this)">Recent</button>
  <button class="np"        data-view="categorized" onclick="setView('categorized',this)">Categorized</button>
  <button class="np"        data-view="all"      onclick="setView('all',this)">View All</button>
  <button class="np add"    onclick="openAddModal()">+ Add Idea</button>
  <button class="np"        onclick="openSettingsModal()">⚙</button>
</nav>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-inner">
      <div class="sb-title">Categories</div>
      <div class="cat-list" id="cat-list"></div>
      <button class="cat-add-btn" onclick="openCatModal()">＋ New category</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="toolbar">
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Search ideas…" oninput="renderIdeas()">
      </div>
      <select class="sort-select" id="sort-sel" onchange="renderIdeas()">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="alpha">A → Z</option>
      </select>
      <div class="view-toggle">
        <button class="vt active" id="vt-list" onclick="setViewMode('list')" title="List view">☰</button>
        <button class="vt"        id="vt-block" onclick="setViewMode('block')" title="Block view">▦</button>
      </div>
    </div>
    <div id="ideas-container" class="list-view"></div>
  </main>
</div>

<!-- ══ ADD IDEA MODAL ══ -->
<div class="modal-overlay" id="add-modal">
  <div class="modal" style="max-width:740px;">
    <div class="modal-h">✦ New Idea</div>

    <div class="field">
      <label>Title *</label>
      <input type="text" id="f-title" placeholder="What's this idea?">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.8rem;">
      <div class="field">
        <label>Category</label>
        <select id="f-category"></select>
      </div>
      <div class="field">
        <label>Tags (comma separated)</label>
        <input type="text" id="f-tags" placeholder="color, layout…">
      </div>
    </div>

    <!-- Cover image -->
    <div class="field">
      <label>Cover image (URL or upload)</label>
      <div style="display:flex;gap:.5rem;align-items:center;">
        <input type="text" id="f-cover-url" placeholder="https://… or upload →" oninput="previewCover(this.value)" style="flex:1;">
        <label style="display:inline-flex;align-items:center;gap:.35rem;font-family:'Caveat',cursive;font-size:.92rem;color:var(--text-dim);background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:.38rem .85rem;cursor:pointer;white-space:nowrap;">
          📁 Upload<input type="file" accept="image/*" style="display:none;" onchange="handleCoverUpload(this)">
        </label>
      </div>
      <img id="f-cover-preview" src="" alt="" style="display:none;width:100%;max-height:160px;object-fit:cover;border-radius:9px;border:1px solid var(--border);margin-top:.6rem;">
      <input type="hidden" id="f-cover-b64">
      <input type="hidden" id="f-cover-fname">
    </div>

    <!-- Notion-like content editor -->
    <div class="field">
      <label>Content</label>
      <div class="notion-editor" id="ne-editor">
        <!-- blocks injected here -->
      </div>
      <div class="ne-toolbar">
        <button class="ne-tb-btn" onclick="addNeBlock('text')">✏ Text</button>
        <button class="ne-tb-btn" onclick="addNeBlock('h2')">H Heading</button>
        <button class="ne-tb-btn" onclick="addNeBlock('quote')">❝ Quote</button>
        <button class="ne-tb-btn" onclick="addNeBlock('img-url')">🔗 Image URL</button>
        <button class="ne-tb-btn">
          📁 Upload Image<input type="file" accept="image/*" onchange="addNeBlock('img-upload',this)">
        </button>
        <button class="ne-tb-btn" onclick="addNeBlock('divider')">— Divider</button>
      </div>
    </div>

    <!-- References -->
    <div class="fsec">
      <div class="fsec-title">🔗 Reference Links</div>
      <div class="ref-rows" id="ref-rows"></div>
      <button class="btn-add-row" onclick="addRefRow()">＋ Add reference</button>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('add-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitIdea()">Save to GitHub</button>
    </div>
    <div id="add-status"></div>
  </div>
</div>

<!-- ══ ADD CATEGORY MODAL ══ -->
<div class="modal-overlay" id="cat-modal">
  <div class="modal" style="max-width:400px;">
    <div class="modal-h">＋ New Category</div>
    <div class="field">
      <label>Category name</label>
      <input type="text" id="cat-name-inp" placeholder="e.g. Photography">
    </div>
    <div class="field">
      <label>Emoji icon</label>
      <input type="text" id="cat-emoji-inp" placeholder="e.g. 📷" style="max-width:100px;">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('cat-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewCategory()">Add</button>
    </div>
  </div>
</div>

<!-- ══ SETTINGS MODAL ══ -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal" style="max-width:500px;">
    <div class="modal-h">⚙ GitHub Settings</div>
    <div class="hint-box">
      Cần GitHub Personal Access Token với scope <strong>repo</strong>.<br>
      <a href="https://github.com/settings/tokens/new" target="_blank">Tạo token ở đây →</a><br>
      Token lưu trong browser (localStorage), không gửi đi đâu ngoài GitHub API.
    </div>
    <div class="field"><label>GitHub Username</label><input type="text" id="s-username" placeholder="jasverine"></div>
    <div class="field"><label>Repository Name</label><input type="text" id="s-repo" placeholder="creative-hall"></div>
    <div class="field"><label>Branch</label><input type="text" id="s-branch" placeholder="main"></div>
    <div class="field"><label>Personal Access Token</label><input type="password" id="s-token" placeholder="ghp_…"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('settings-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveSettings()">Save</button>
    </div>
    <div id="settings-status"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let allIdeas    = [];
let currentView = 'recent';   // recent | categorized | all
let activeCategory = 'all';
let viewMode    = 'list';      // list | block
let categories  = JSON.parse(localStorage.getItem('categories')||'null') ||
  [{name:'Design',emoji:'🎨'},{name:'Data Science',emoji:'📊'},
   {name:'Retouching',emoji:'✨'},{name:'Mindset',emoji:'🧠'},
   {name:'General Topic',emoji:'📝'},{name:'Uncategorized',emoji:'📦'}];

function saveCategories(){ localStorage.setItem('categories', JSON.stringify(categories)); }

// ═══════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════
function getConfig(){
  return{username:localStorage.getItem('gh_username')||'',
         repo:localStorage.getItem('gh_repo')||'',
         branch:localStorage.getItem('gh_branch')||'main',
         token:localStorage.getItem('gh_token')||''};
}
function saveSettings(){
  localStorage.setItem('gh_username',document.getElementById('s-username').value.trim());
  localStorage.setItem('gh_repo',    document.getElementById('s-repo').value.trim());
  localStorage.setItem('gh_branch',  document.getElementById('s-branch').value.trim()||'main');
  localStorage.setItem('gh_token',   document.getElementById('s-token').value.trim());
  showStatus('settings-status','Saved!','success');
  setTimeout(()=>closeModal('settings-modal'),1100);
}

// ═══════════════════════════════════════════════
// LOAD
// ═══════════════════════════════════════════════
async function loadIdeas(){
  try{const r=await fetch(`ideas/manifest.json?t=${Date.now()}`);allIdeas=await r.json();}
  catch(e){allIdeas=[];}
  renderAll();
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function renderAll(){ renderSidebar(); renderIdeas(); }

function setView(v,el){
  currentView=v; activeCategory='all';
  document.querySelectorAll('.np[data-view]').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}
function setViewMode(m){
  viewMode=m;
  document.getElementById('vt-list').classList.toggle('active',m==='list');
  document.getElementById('vt-block').classList.toggle('active',m==='block');
  document.getElementById('ideas-container').className = m==='list'?'list-view':'block-view';
  renderIdeas();
}
function setCategory(name){
  activeCategory=name; renderSidebar(); renderIdeas();
}

function renderSidebar(){
  const counts={};
  allIdeas.forEach(i=>{counts[i.category]=(counts[i.category]||0)+1;});
  const cl=document.getElementById('cat-list');
  cl.innerHTML=`<button class="cat-item ${activeCategory==='all'?'active':''}"
    onclick="setCategory('all')">
    <span>All ideas</span>
    <span class="cat-count">${allIdeas.length}</span>
  </button>`
  +categories.map(c=>`
    <button class="cat-item ${activeCategory===c.name?'active':''}" onclick="setCategory(${JSON.stringify(c.name)})">
      <span>${c.emoji||''} ${c.name}</span>
      <span class="cat-count">${counts[c.name]||0}</span>
    </button>`).join('');

  // also refresh category select in form
  const sel=document.getElementById('f-category');
  if(sel){
    const cur=sel.value;
    sel.innerHTML=categories.map(c=>`<option value="${esc(c.name)}">${c.emoji||''} ${c.name}</option>`).join('');
    if(cur) sel.value=cur;
  }
}

function renderIdeas(){
  const container=document.getElementById('ideas-container');
  const q=document.getElementById('search-input').value.toLowerCase();
  const sort=document.getElementById('sort-sel').value;
  let list=[...allIdeas];

  // filter
  if(q) list=list.filter(i=>
    i.title.toLowerCase().includes(q)||
    (i.content||'').toLowerCase().includes(q)||
    (i.tags||[]).join(' ').toLowerCase().includes(q));
  if(activeCategory!=='all') list=list.filter(i=>i.category===activeCategory);

  // sort
  if(sort==='date-desc') list.sort((a,b)=>new Date(b.date)-new Date(a.date));
  else if(sort==='date-asc') list.sort((a,b)=>new Date(a.date)-new Date(b.date));
  else list.sort((a,b)=>a.title.localeCompare(b.title));

  // recent = last 10 by date
  if(currentView==='recent') list=list.slice(0,10);

  if(!list.length){
    container.innerHTML=`<div class="empty-state">No ideas here yet… add one ✦</div>`;
    return;
  }

  if(currentView==='categorized'){
    // group by category
    const groups={};
    list.forEach(i=>{
      const k=i.category||'Uncategorized';
      if(!groups[k]) groups[k]=[];
      groups[k].push(i);
    });
    container.innerHTML=Object.entries(groups).map(([cat,ideas])=>{
      const catObj=categories.find(c=>c.name===cat)||{emoji:'📦'};
      return `<div class="cat-section">
        <div class="cat-section-header">${catObj.emoji||''} ${esc(cat)}</div>
        <div class="${viewMode==='list'?'list-view':'block-view'}" style="display:${viewMode==='list'?'flex':'grid'};flex-direction:${viewMode==='list'?'column':'unset'};gap:.7rem;">
          ${ideas.map((idea,i)=>ideaCardHtml(idea,i)).join('')}
        </div>
      </div>`;
    }).join('');
  } else {
    container.innerHTML=list.map((idea,i)=>ideaCardHtml(idea,i)).join('');
  }
}

function ideaCardHtml(idea,i){
  const delay=`style="animation-delay:${i*0.04}s"`;
  const cover=idea.cover||'';
  const badges=`
    <span class="badge badge-cat">${esc(idea.category||'')}</span>
    ${idea.imageCount?`<span class="badge badge-img">🖼 ${idea.imageCount}</span>`:''}
    ${idea.refCount?`<span class="badge badge-ref">🔗 ${idea.refCount}</span>`:''}`;

  if(viewMode==='list'){
    return `<a class="idea-list-card" href="ideas/${idea.file}" ${delay}>
      ${cover
        ?`<img class="list-thumb" src="${esc(cover)}" alt="" loading="lazy">`
        :`<div class="list-thumb-placeholder">${getCatEmoji(idea.category)}</div>`}
      <div class="list-body">
        <div class="list-title">${esc(idea.title)}</div>
        <div class="list-meta"><span>${fmtDate(idea.date)}</span></div>
        <div class="list-preview">${esc((idea.content||'').slice(0,120))}</div>
        <div class="list-badges">${badges}</div>
      </div>
    </a>`;
  } else {
    return `<a class="idea-block-card" href="ideas/${idea.file}" ${delay}>
      ${cover
        ?`<img class="block-cover" src="${esc(cover)}" alt="" loading="lazy">`
        :`<div class="block-cover-placeholder">${getCatEmoji(idea.category)}</div>`}
      <div class="block-body">
        <div class="block-title">${esc(idea.title)}</div>
        <div class="block-meta">${fmtDate(idea.date)}</div>
        <div class="block-preview">${esc((idea.content||'').slice(0,160))}</div>
        <div class="block-badges">${badges}</div>
      </div>
    </a>`;
  }
}

function getCatEmoji(cat){
  const c=categories.find(x=>x.name===cat);
  return c?c.emoji:'📝';
}

// ═══════════════════════════════════════════════
// NOTION-LIKE EDITOR
// ═══════════════════════════════════════════════
let neBlockId=0;
const neBlocks={}; // id -> {type, data}

function initEditor(){
  neBlocks_clear();
  document.getElementById('ne-editor').querySelectorAll('.ne-block').forEach(el=>el.remove());
  addNeBlock('text'); // start with one empty text block
}

function neBlocks_clear(){
  for(const k in neBlocks) delete neBlocks[k];
  neBlockId=0;
}

function addNeBlock(type, fileInput){
  const id='nb'+neBlockId++;
  neBlocks[id]={type,data:{}};

  const wrap=document.createElement('div');
  wrap.className='ne-block'; wrap.id=id;

  let inner='';
  if(type==='text'){
    inner=`<span class="ne-block-type">¶</span>
      <textarea class="ne-content ne-text" rows="1" placeholder="Write something…"
        oninput="autoResize(this);neBlocks['${id}'].data.text=this.value"
        onkeydown="neKeydown(event,'${id}')"></textarea>`;
  } else if(type==='h2'){
    inner=`<span class="ne-block-type">H</span>
      <textarea class="ne-content ne-text" rows="1" placeholder="Heading…"
        style="font-size:1.25rem;font-weight:600;color:var(--accent);"
        oninput="autoResize(this);neBlocks['${id}'].data.text=this.value"
        onkeydown="neKeydown(event,'${id}')"></textarea>`;
  } else if(type==='quote'){
    inner=`<span class="ne-block-type">❝</span>
      <textarea class="ne-content ne-text" rows="1" placeholder="Quote…"
        style="font-style:italic;color:var(--text-dim);border-left:3px solid var(--accent);padding-left:.7rem;border-radius:0;"
        oninput="autoResize(this);neBlocks['${id}'].data.text=this.value"
        onkeydown="neKeydown(event,'${id}')"></textarea>`;
  } else if(type==='img-url'){
    inner=`<span class="ne-block-type">🖼</span>
      <div class="ne-content">
        <input class="ne-img-url" placeholder="Image URL https://…"
          oninput="neBlocks['${id}'].data.url=this.value;updateImgPreview('${id}',this.value)">
        <img id="neimg-${id}" class="ne-img-preview" src="" alt="" style="display:none;">
        <input class="ne-img-caption" placeholder="Caption…"
          oninput="neBlocks['${id}'].data.caption=this.value">
      </div>`;
  } else if(type==='img-upload'){
    const file=fileInput.files[0];
    if(!file){return;}
    const reader=new FileReader();
    reader.onload=e=>{
      neBlocks[id].data.b64=e.target.result.split(',')[1];
      neBlocks[id].data.fname=file.name;
      neBlocks[id].data.previewSrc=e.target.result;
      const img=document.getElementById('neimg-'+id);
      if(img){img.src=e.target.result;img.style.display='block';}
    };
    reader.readAsDataURL(file);
    inner=`<span class="ne-block-type">🖼</span>
      <div class="ne-content">
        <img id="neimg-${id}" class="ne-img-preview" src="" alt="">
        <input class="ne-img-caption" placeholder="Caption…"
          oninput="neBlocks['${id}'].data.caption=this.value">
      </div>`;
    fileInput.value='';
  } else if(type==='divider'){
    neBlocks[id].data={};
    inner=`<span class="ne-block-type">—</span>
      <div class="ne-content" style="height:1px;background:var(--border);margin:.6rem 0;pointer-events:none;border-radius:1px;"></div>`;
  }

  wrap.innerHTML=`<span class="ne-drag" title="drag">⠿</span>${inner}
    <button class="ne-remove" onclick="removeNeBlock('${id}')" title="Remove">✕</button>`;
  document.getElementById('ne-editor').insertBefore(wrap, document.querySelector('.ne-toolbar'));

  // auto resize first textarea
  const ta=wrap.querySelector('textarea');
  if(ta){autoResize(ta);}
}

function removeNeBlock(id){
  const el=document.getElementById(id);
  if(el) el.remove();
  delete neBlocks[id];
}

function updateImgPreview(id,url){
  const img=document.getElementById('neimg-'+id);
  if(!img) return;
  if(url){img.src=url;img.style.display='block';}
  else{img.style.display='none';}
}

function autoResize(el){
  el.style.height='auto';
  el.style.height=el.scrollHeight+'px';
}

function neKeydown(e,id){
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    addNeBlock('text');
    // focus the new textarea
    const all=document.getElementById('ne-editor').querySelectorAll('.ne-text');
    if(all.length) all[all.length-1].focus();
  }
}

// Collect all blocks as structured data + HTML
function collectEditorData(){
  const blocks=[];
  document.getElementById('ne-editor').querySelectorAll('.ne-block').forEach(el=>{
    const id=el.id;
    const b=neBlocks[id];
    if(!b) return;
    const entry={type:b.type,...b.data};
    // get live textarea values
    const ta=el.querySelector('textarea');
    if(ta) entry.text=ta.value;
    const capInp=el.querySelector('.ne-img-caption');
    if(capInp) entry.caption=capInp.value;
    const urlInp=el.querySelector('.ne-img-url');
    if(urlInp) entry.url=urlInp.value;
    blocks.push(entry);
  });
  return blocks;
}

function blocksToHtml(blocks){
  return blocks.map(b=>{
    if(b.type==='text')    return `<p class="idea-p">${esc(b.text||'').replace(/\n/g,'<br>')}</p>`;
    if(b.type==='h2')      return `<h2 class="idea-h2">${esc(b.text||'')}</h2>`;
    if(b.type==='quote')   return `<blockquote class="idea-quote">${esc(b.text||'')}</blockquote>`;
    if(b.type==='divider') return `<hr class="idea-hr">`;
    if(b.type==='img-url'||b.type==='img-upload'){
      const src=b.uploadedPath||b.url||'';
      return `<figure class="idea-figure">
        <img src="${esc(src)}" alt="${esc(b.caption||'')}" class="idea-img" onclick="openLb('${esc(src)}')">
        ${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:''}
      </figure>`;
    }
    return '';
  }).join('\n');
}

function blocksToPreview(blocks){
  return blocks.filter(b=>b.text).map(b=>b.text).join(' ').slice(0,200);
}

// ═══════════════════════════════════════════════
// REF ROWS
// ═══════════════════════════════════════════════
let refRowId=0;
function addRefRow(){
  const id='rr'+refRowId++;
  const div=document.createElement('div');
  div.className='ref-row'; div.id=id;
  div.innerHTML=`
    <div class="ref-row-main">
      <input type="text" class="rr-label" placeholder="Label (e.g. Dribbble inspo)"
        style="background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:.42rem .7rem;color:var(--text);outline:none;font-family:inherit;font-size:.92rem;flex:1;">
      <input type="url" class="rr-url" placeholder="https://…"
        style="background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:.42rem .7rem;color:var(--text);outline:none;font-family:inherit;font-size:.92rem;flex:1.3;">
      <button class="btn-icon" onclick="document.getElementById('${id}').remove()">✕</button>
    </div>
    <input type="text" class="rr-note ref-note-inp"
      style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:.35rem .7rem;color:var(--text-dim);outline:none;font-family:inherit;font-size:.88rem;font-style:italic;"
      placeholder="Note… (optional)">`;
  document.getElementById('ref-rows').appendChild(div);
}

// ═══════════════════════════════════════════════
// COVER IMAGE
// ═══════════════════════════════════════════════
function previewCover(url){
  const img=document.getElementById('f-cover-preview');
  document.getElementById('f-cover-b64').value='';
  document.getElementById('f-cover-fname').value='';
  if(url){img.src=url;img.style.display='block';}else{img.style.display='none';}
}
function handleCoverUpload(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    document.getElementById('f-cover-b64').value=e.target.result.split(',')[1];
    document.getElementById('f-cover-fname').value=file.name;
    document.getElementById('f-cover-url').value='';
    const img=document.getElementById('f-cover-preview');
    img.src=e.target.result; img.style.display='block';
  };
  reader.readAsDataURL(file);
}

// ═══════════════════════════════════════════════
// CATEGORY MODAL
// ═══════════════════════════════════════════════
function openCatModal(){ document.getElementById('cat-modal').classList.add('open'); }
function saveNewCategory(){
  const name=document.getElementById('cat-name-inp').value.trim();
  const emoji=document.getElementById('cat-emoji-inp').value.trim()||'📝';
  if(!name) return;
  if(!categories.find(c=>c.name===name)){
    categories.push({name,emoji});
    saveCategories();
    renderSidebar();
  }
  document.getElementById('cat-name-inp').value='';
  document.getElementById('cat-emoji-inp').value='';
  closeModal('cat-modal');
}

// ═══════════════════════════════════════════════
// MODAL HELPERS
// ═══════════════════════════════════════════════
function openAddModal(){
  const cfg=getConfig();
  if(!cfg.token||!cfg.username||!cfg.repo){
    openSettingsModal();
    showStatus('settings-status','Please configure GitHub settings first.','error');
    return;
  }
  // reset
  ['f-title','f-tags','f-cover-url','f-cover-b64','f-cover-fname'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('f-cover-preview').style.display='none';
  document.getElementById('ref-rows').innerHTML='';
  document.getElementById('add-status').className=''; document.getElementById('add-status').textContent='';
  initEditor();
  document.getElementById('add-modal').classList.add('open');
}
function openSettingsModal(){
  const cfg=getConfig();
  document.getElementById('s-username').value=cfg.username;
  document.getElementById('s-repo').value=cfg.repo;
  document.getElementById('s-branch').value=cfg.branch;
  document.getElementById('s-token').value=cfg.token;
  document.getElementById('settings-modal').classList.add('open');
}
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m=>{
  m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('open'); });
});
function showStatus(id,msg,type){
  const el=document.getElementById(id);
  el.className='status-msg '+type; el.textContent=msg;
}

// ═══════════════════════════════════════════════
// SUBMIT
// ═══════════════════════════════════════════════
async function submitIdea(){
  const title  =document.getElementById('f-title').value.trim();
  const cat    =document.getElementById('f-category').value;
  const tagsRaw=document.getElementById('f-tags').value.trim();
  const blocks =collectEditorData();

  if(!title){ showStatus('add-status','Title is required.','error'); return; }
  if(!blocks.length||blocks.every(b=>!b.text&&!b.url&&!b.b64)){
    showStatus('add-status','Please add some content.','error'); return;
  }

  const tags =tagsRaw?tagsRaw.split(',').map(t=>t.trim()).filter(Boolean):[];
  const date =new Date().toISOString();
  const slug =title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const ts   =Date.now();
  const filename=`${slug}-${ts}.html`;
  const cfg  =getConfig();

  showStatus('add-status','Saving…','loading');

  try{
    // 1. Upload cover image if needed
    let coverPath='';
    const coverB64  =document.getElementById('f-cover-b64').value;
    const coverFname=document.getElementById('f-cover-fname').value;
    const coverUrl  =document.getElementById('f-cover-url').value.trim();
    if(coverB64&&coverFname){
      const ext=coverFname.split('.').pop();
      const cname=`cover-${slug}-${ts}.${ext}`;
      await ghPut(cfg,`ideas/images/${cname}`,coverB64);
      coverPath=`images/${cname}`;
    } else if(coverUrl){ coverPath=coverUrl; }

    // 2. Upload any block images
    for(const b of blocks){
      if((b.type==='img-upload')&&b.b64&&b.fname){
        showStatus('add-status',`Uploading image…`,'loading');
        const ext=b.fname.split('.').pop();
        const iname=`img-${slug}-${ts}-${Math.random().toString(36).slice(2,6)}.${ext}`;
        await ghPut(cfg,`ideas/images/${iname}`,b.b64);
        b.uploadedPath=`images/${iname}`;
      }
    }

    // 3. Collect references
    const refs=[];
    for(const row of document.getElementById('ref-rows').querySelectorAll('.ref-row')){
      const label=row.querySelector('.rr-label').value.trim();
      const url  =row.querySelector('.rr-url').value.trim();
      const note =row.querySelector('.rr-note').value.trim();
      if(url) refs.push({label:label||url,url,note});
    }

    // 4. Build HTML
    const contentHtml=blocksToHtml(blocks);
    const contentPreview=blocksToPreview(blocks);

    const tagsHtml=tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('');

    const refsHtml=refs.length?`<div class="section-card">
      <div class="section-title">🔗 References</div>
      <div class="ref-list">${refs.map(r=>{
        let icon='🔗';
        const icons={'github':'🐙','figma':'🎨','dribbble':'🏀','youtube':'▶️','notion':'📓','pinterest':'📌','behance':'🅱','medium':'✍️'};
        try{const h=new URL(r.url).hostname;for(const[k,v] of Object.entries(icons)){if(h.includes(k)){icon=v;break;}}}catch(e){}
        return `<a class="ref-item" href="${esc(r.url)}" target="_blank" rel="noopener">
          <div class="ref-icon">${icon}</div>
          <div class="ref-body">
            <div class="ref-label">${esc(r.label)}</div>
            <div class="ref-url">${esc(r.url)}</div>
            ${r.note?`<div class="ref-note">${esc(r.note)}</div>`:''}
          </div></a>`;
      }).join('')}</div></div>`:'' ;

    const imgCount=blocks.filter(b=>b.type==='img-url'||b.type==='img-upload').length;

    // build full idea page
    const ideaHtml=buildIdeaPage({title,cat,date,contentHtml,tagsHtml,refsHtml,coverPath});

    // 5. Commit files
    showStatus('add-status','Committing to GitHub…','loading');
    await ghPut(cfg,`ideas/${filename}`,toB64(ideaHtml));

    const newEntry={title,category:cat,content:contentPreview,tags,date,file:filename,
      cover:coverPath,imageCount:imgCount,refCount:refs.length};
    const manifest=[newEntry,...allIdeas];
    await ghPut(cfg,'ideas/manifest.json',toB64(JSON.stringify(manifest,null,2)));

    allIdeas=manifest;
    renderAll();
    showStatus('add-status','✓ Saved! GitHub Pages will update shortly.','success');
    setTimeout(()=>closeModal('add-modal'),2200);

  }catch(err){
    console.error(err);
    showStatus('add-status','Error: '+err.message,'error');
  }
}

// ═══════════════════════════════════════════════
// BUILD IDEA PAGE HTML
// ═══════════════════════════════════════════════
function buildIdeaPage({title,cat,date,contentHtml,tagsHtml,refsHtml,coverPath}){
  const catObj=categories.find(c=>c.name===cat)||{emoji:'📝'};
  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>${esc(title)} — Creative Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a1f1a;--bg2:#332621;--surface:#3e2f28;--surface2:#4a3830;--surface3:#57433a;
  --text:#d8c8b8;--text-dim:#8a7a6a;--accent:#c9a882;--accent2:#e2c49a;
  --border:rgba(201,168,130,0.13);--border2:rgba(201,168,130,0.28);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.05'/%3E%3C/svg%3E");}

/* hero */
.hero{position:relative;height:340px;overflow:hidden;background:var(--surface);}
.hero-img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.65);}
.hero-no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:5rem;background:linear-gradient(135deg,var(--bg2),var(--surface2));}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,rgba(42,31,26,.95));display:flex;flex-direction:column;justify-content:flex-end;padding:2rem 2.5rem;}
.back-link{position:absolute;top:1.2rem;left:1.5rem;display:inline-flex;align-items:center;gap:.4rem;
  color:rgba(255,255,255,.7);text-decoration:none;font-family:'Caveat',cursive;font-size:1.05rem;
  background:rgba(0,0,0,.35);backdrop-filter:blur(6px);padding:.35rem .9rem;border-radius:99px;transition:color .2s;}
.back-link:hover{color:#fff;}
.hero-cat{font-family:'Caveat',cursive;font-size:.9rem;color:var(--accent);background:rgba(0,0,0,.4);
  backdrop-filter:blur(4px);padding:.25rem .8rem;border-radius:99px;margin-bottom:.6rem;display:inline-block;width:fit-content;}
.hero-title{font-size:clamp(1.6rem,4vw,2.6rem);font-weight:300;font-style:italic;color:#fff;line-height:1.2;text-shadow:0 2px 12px rgba(0,0,0,.5);}
.hero-date{font-size:.85rem;color:rgba(255,255,255,.55);margin-top:.35rem;}

/* content */
.page{max-width:780px;margin:0 auto;padding:2.5rem 1.5rem 4rem;position:relative;z-index:1;}
.idea-p{font-size:1.12rem;line-height:1.85;margin-bottom:1rem;}
.idea-h2{font-size:1.5rem;font-weight:600;color:var(--accent);margin:1.8rem 0 .7rem;font-style:italic;}
.idea-quote{border-left:3px solid var(--accent);padding:.5rem 1.1rem;color:var(--text-dim);
  font-style:italic;font-size:1.05rem;margin:1rem 0;background:rgba(201,168,130,.05);border-radius:0 8px 8px 0;}
.idea-hr{border:none;border-top:1px solid var(--border);margin:1.8rem 0;}
.idea-figure{margin:1.4rem 0;text-align:center;}
.idea-img{max-width:100%;border-radius:10px;cursor:zoom-in;border:1px solid var(--border);transition:transform .2s;}
.idea-img:hover{transform:scale(1.01);}
.idea-figure figcaption{font-size:.88rem;color:var(--text-dim);font-style:italic;margin-top:.5rem;}

/* tags */
.tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border);}
.tag{background:var(--surface2);color:var(--text-dim);font-family:'Caveat',cursive;padding:.2rem .8rem;border-radius:12px;font-size:.9rem;}

/* sections */
.section-card{background:var(--surface);border-radius:14px;padding:1.6rem 1.8rem;border:1px solid var(--border);margin-top:1.5rem;}
.section-title{font-family:'Caveat',cursive;font-size:1.25rem;color:var(--accent);
  margin-bottom:1rem;padding-bottom:.6rem;border-bottom:1px solid var(--border);}

/* refs */
.ref-list{display:flex;flex-direction:column;gap:.6rem;}
.ref-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:.8rem 1rem;display:flex;align-items:flex-start;gap:.7rem;text-decoration:none;color:inherit;transition:all .2s;}
.ref-item:hover{border-color:var(--border2);background:var(--surface2);}
.ref-icon{font-size:1.1rem;flex-shrink:0;width:30px;height:30px;background:var(--surface2);border-radius:7px;display:flex;align-items:center;justify-content:center;}
.ref-body{flex:1;min-width:0;}
.ref-label{font-family:'Caveat',cursive;font-size:1.02rem;color:var(--accent);}
.ref-url{font-size:.78rem;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:.08rem;}
.ref-note{font-size:.9rem;color:var(--text-dim);margin-top:.2rem;font-style:italic;}

/* lightbox */
#lb{position:fixed;inset:0;z-index:999;background:rgba(10,6,4,.93);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
#lb.open{opacity:1;pointer-events:all;}
#lb img{max-width:92vw;max-height:90vh;border-radius:10px;box-shadow:0 20px 80px rgba(0,0,0,.7);}
#lb-x{position:absolute;top:1rem;right:1rem;font-size:1.3rem;color:rgba(255,255,255,.6);
  cursor:pointer;background:rgba(0,0,0,.5);width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;transition:color .2s;}
#lb-x:hover{color:#fff;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px;}
</style>
</head>
<body>
<div class="hero">
  ${coverPath
    ?`<img class="hero-img" src="${esc(coverPath)}" alt="">`
    :`<div class="hero-no-img">${catObj.emoji||'📝'}</div>`}
  <div class="hero-overlay">
    <a class="back-link" href="../index.html">← Back to Hall</a>
    <div class="hero-cat">${catObj.emoji||''} ${esc(cat)}</div>
    <div class="hero-title">${esc(title)}</div>
    <div class="hero-date">${fmtDate(date)}</div>
  </div>
</div>
<div class="page">
  <div class="idea-content">${contentHtml}</div>
  ${tagsHtml?`<div class="tags">${tagsHtml}</div>`:''}
  ${refsHtml}
</div>
<div id="lb" onclick="closeLb()"><div id="lb-x" onclick="closeLb()">✕</div><img id="lb-img" src="" alt=""></div>
<script>
function openLb(s){document.getElementById('lb-img').src=s;document.getElementById('lb').classList.add('open');}
function closeLb(){document.getElementById('lb').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});
<\/script>
</body>
</html>`;
}

// ═══════════════════════════════════════════════
// GITHUB API
// ═══════════════════════════════════════════════
async function ghPut(cfg,path,b64Content){
  const url=`https://api.github.com/repos/${cfg.username}/${cfg.repo}/contents/${path}`;
  let sha=null;
  try{
    const r=await fetch(url,{headers:{'Authorization':`token ${cfg.token}`,'Accept':'application/vnd.github.v3+json'}});
    if(r.ok){const d=await r.json();sha=d.sha;}
  }catch(e){}
  const body={message:`Update ${path}`,content:b64Content,branch:cfg.branch};
  if(sha) body.sha=sha;
  const res=await fetch(url,{method:'PUT',
    headers:{'Authorization':`token ${cfg.token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify(body)});
  if(!res.ok){const e=await res.json();throw new Error(e.message||'GitHub API error');}
  return res.json();
}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toB64(str){return btoa(unescape(encodeURIComponent(str)));}
function fmtDate(d){if(!d)return'';return new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
loadIdeas();
</script>
</body>
</html>
