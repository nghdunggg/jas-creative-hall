<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jasverine's Creative Hall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Variables ── */
    :root {
      --bg:       #2e2520;
      --bg2:      #3a2f2a;
      --surface:  #4a3f38;
      --surface2: #574a42;
      --surface3: #624e45;
      --text:     #d4c5b8;
      --text-dim: #8a7a70;
      --accent:   #c9a882;
      --accent2:  #e8c99a;
      --danger:   #b87070;
      --border:   rgba(201,168,130,0.15);
      --shadow:   0 8px 40px rgba(0,0,0,0.4);
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', Georgia, serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Grain texture overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 2.5rem 2rem 1rem;
      position: relative;
      z-index: 1;
    }
    .site-title {
      font-family: 'Caveat', cursive;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
      text-shadow: 0 2px 20px rgba(201,168,130,0.2);
    }

    /* ── Nav ── */
    nav {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.8rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(46,37,32,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'Caveat', cursive;
      font-size: 1.1rem;
      padding: 0.45rem 1.4rem;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .nav-pill:hover, .nav-pill.active {
      background: var(--surface3);
      color: var(--accent);
      border-color: rgba(201,168,130,0.4);
    }
    .nav-pill.add-btn {
      background: var(--accent);
      color: var(--bg);
      font-weight: 700;
      border-color: var(--accent);
    }
    .nav-pill.add-btn:hover {
      background: var(--accent2);
      color: var(--bg);
    }

    /* ── Main layout ── */
    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      position: relative;
      z-index: 1;
    }
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { order: -1; }
    }

    /* ── Ideas panel ── */
    .panel {
      background: var(--surface);
      border-radius: 18px;
      padding: 1.8rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .panel-title {
      font-family: 'Caveat', cursive;
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 1.2rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border);
    }

    /* ── Idea cards ── */
    #ideas-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .idea-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      cursor: pointer;
      transition: all 0.25s ease;
      animation: fadeUp 0.4s ease both;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .idea-card:hover {
      background: var(--surface2);
      border-color: rgba(201,168,130,0.35);
      transform: translateX(4px);
      box-shadow: -3px 0 0 var(--accent);
    }
    .idea-card-title {
      font-size: 1.25rem;
      font-weight: 400;
      font-style: italic;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }
    .idea-card-meta {
      font-size: 0.85rem;
      color: var(--text-dim);
      display: flex;
      gap: 0.8rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }
    .idea-card-preview {
      font-size: 1rem;
      color: var(--text-dim);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cat-badge {
      background: var(--surface2);
      color: var(--accent);
      font-family: 'Caveat', cursive;
      font-size: 0.8rem;
      padding: 0.15rem 0.7rem;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-dim);
      font-style: italic;
      font-size: 1.1rem;
    }

    /* ── Sidebar categories ── */
    .sidebar {}
    .cat-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .cat-item {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 0.7rem 1.2rem;
      cursor: pointer;
      font-family: 'Caveat', cursive;
      font-size: 1.1rem;
      text-align: center;
      transition: all 0.2s;
      color: var(--text-dim);
    }
    .cat-item:hover, .cat-item.active {
      background: var(--surface2);
      color: var(--accent);
      border-color: rgba(201,168,130,0.35);
    }

    /* ── Modal overlay ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(20,14,10,0.8);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    .modal {
      background: var(--surface);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 620px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 80px rgba(0,0,0,0.6);
      transform: translateY(24px);
      transition: transform 0.3s;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal h2 {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: 1.5rem;
    }
    .field { margin-bottom: 1.2rem; }
    .field label {
      display: block;
      font-family: 'Caveat', cursive;
      font-size: 1rem;
      color: var(--text-dim);
      margin-bottom: 0.4rem;
    }
    .field input, .field textarea, .field select {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.05rem;
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: rgba(201,168,130,0.5);
    }
    .field select option { background: var(--surface2); }
    .field textarea { min-height: 160px; }
    .modal-actions {
      display: flex;
      gap: 0.8rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    .btn {
      font-family: 'Caveat', cursive;
      font-size: 1.1rem;
      padding: 0.6rem 1.6rem;
      border-radius: 99px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 700;
    }
    .btn-primary:hover { background: var(--accent2); }
    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
    }
    .btn-ghost:hover { color: var(--text); background: var(--surface2); }

    /* ── GitHub settings modal ── */
    .settings-hint {
      font-size: 0.9rem;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 1.2rem;
      padding: 0.8rem;
      background: var(--bg2);
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }
    .settings-hint a { color: var(--accent); }
    .status-msg {
      padding: 0.8rem 1rem;
      border-radius: 8px;
      font-family: 'Caveat', cursive;
      font-size: 1rem;
      margin-top: 1rem;
    }
    .status-msg.success { background: rgba(100,160,100,0.15); color: #8dc88d; border: 1px solid rgba(100,160,100,0.2); }
    .status-msg.error   { background: rgba(180,100,100,0.15); color: var(--danger); border: 1px solid rgba(180,100,100,0.2); }
    .status-msg.loading { background: rgba(201,168,130,0.1); color: var(--accent); border: 1px solid var(--border); }

    /* ── Search ── */
    .search-wrap { margin-bottom: 1.2rem; position: relative; }
    .search-wrap input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 0.65rem 1.2rem 0.65rem 2.6rem;
      color: var(--text);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-wrap input:focus { border-color: rgba(201,168,130,0.4); }
    .search-wrap::before {
      content: '⌕';
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 1.2rem;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="site-title">Jasverine's Creative Hall</div>
</header>

<!-- Nav -->
<nav>
  <button class="nav-pill active" onclick="setView('recent')">Recent Ideas</button>
  <button class="nav-pill" onclick="setView('categorized')">Categorized</button>
  <button class="nav-pill" onclick="setView('all')">View All</button>
  <button class="nav-pill add-btn" onclick="openAddModal()">+ Add Idea</button>
  <button class="nav-pill" onclick="openSettingsModal()" title="GitHub Settings">⚙</button>
</nav>

<!-- Layout -->
<div class="layout">
  <!-- Left: ideas list -->
  <div>
    <div class="panel">
      <div class="panel-title" id="panel-title">Recent ideas</div>
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Search ideas…" oninput="renderIdeas()">
      </div>
      <div id="ideas-grid"></div>
    </div>
  </div>

  <!-- Right: categories -->
  <div class="sidebar">
    <div class="panel">
      <div class="panel-title">Categories</div>
      <div class="cat-list" id="cat-list"></div>
    </div>
  </div>
</div>

<!-- ══ Add Idea Modal ══ -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <h2>✦ New Idea</h2>
    <div class="field">
      <label>Title</label>
      <input type="text" id="f-title" placeholder="What's this idea called?">
    </div>
    <div class="field">
      <label>Category</label>
      <select id="f-category">
        <option>Design</option>
        <option>Data Science</option>
        <option>Retouching</option>
        <option>Mindset</option>
        <option>General Topic</option>
        <option>Uncategorized</option>
      </select>
    </div>
    <div class="field">
      <label>Your Idea</label>
      <textarea id="f-content" placeholder="Write your idea here…"></textarea>
    </div>
    <div class="field">
      <label>Tags (comma separated)</label>
      <input type="text" id="f-tags" placeholder="e.g. color, typography, layout">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('add-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitIdea()">Save to GitHub</button>
    </div>
    <div id="add-status"></div>
  </div>
</div>

<!-- ══ GitHub Settings Modal ══ -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h2>⚙ GitHub Settings</h2>
    <div class="settings-hint">
      To save ideas directly from this page, you need a GitHub Personal Access Token with <strong>repo</strong> scope.<br><br>
      <a href="https://github.com/settings/tokens/new" target="_blank">Create a token here →</a><br><br>
      These settings are saved in your browser only.
    </div>
    <div class="field">
      <label>GitHub Username</label>
      <input type="text" id="s-username" placeholder="e.g. jasverine">
    </div>
    <div class="field">
      <label>Repository Name</label>
      <input type="text" id="s-repo" placeholder="e.g. creative-hall">
    </div>
    <div class="field">
      <label>Branch</label>
      <input type="text" id="s-branch" placeholder="main">
    </div>
    <div class="field">
      <label>Personal Access Token</label>
      <input type="password" id="s-token" placeholder="ghp_…">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('settings-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
    </div>
    <div id="settings-status"></div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────
let allIdeas = [];
let currentView = 'recent';
let activeCategory = 'all';

const CATEGORIES = ['Design','Data Science','Retouching','Mindset','General Topic','Uncategorized'];

// ── GitHub Config (localStorage) ──────────────────────────────
function getConfig() {
  return {
    username: localStorage.getItem('gh_username') || '',
    repo:     localStorage.getItem('gh_repo')     || '',
    branch:   localStorage.getItem('gh_branch')   || 'main',
    token:    localStorage.getItem('gh_token')    || '',
  };
}

function saveSettings() {
  localStorage.setItem('gh_username', document.getElementById('s-username').value.trim());
  localStorage.setItem('gh_repo',     document.getElementById('s-repo').value.trim());
  localStorage.setItem('gh_branch',   document.getElementById('s-branch').value.trim() || 'main');
  localStorage.setItem('gh_token',    document.getElementById('s-token').value.trim());
  showStatus('settings-status', 'Settings saved!', 'success');
  setTimeout(() => closeModal('settings-modal'), 1200);
}

// ── Load ideas from manifest ───────────────────────────────────
async function loadIdeas() {
  try {
    const r = await fetch(`ideas/manifest.json?t=${Date.now()}`);
    allIdeas = await r.json();
  } catch(e) {
    allIdeas = [];
  }
  renderIdeas();
  renderCategories();
}

// ── Render ─────────────────────────────────────────────────────
function setView(v) {
  currentView = v;
  activeCategory = 'all';
  document.querySelectorAll('.nav-pill').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('panel-title').textContent =
    v === 'recent' ? 'Recent ideas' :
    v === 'categorized' ? 'By category' : 'All ideas';
  renderIdeas();
  renderCategories();
}

function setCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  renderIdeas();
}

function renderIdeas() {
  const grid = document.getElementById('ideas-grid');
  const q = document.getElementById('search-input').value.toLowerCase();

  let list = [...allIdeas];

  // Filter by search
  if (q) {
    list = list.filter(i =>
      i.title.toLowerCase().includes(q) ||
      (i.content || '').toLowerCase().includes(q) ||
      (i.tags || []).join(' ').toLowerCase().includes(q)
    );
  }

  // Filter by category
  if (activeCategory !== 'all') {
    list = list.filter(i => i.category === activeCategory);
  }

  // Sort
  if (currentView === 'recent') {
    list = list.sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 10);
  } else {
    list = list.sort((a,b) => new Date(b.date) - new Date(a.date));
  }

  if (list.length === 0) {
    grid.innerHTML = `<div class="empty-state">No ideas yet… add one! ✦</div>`;
    return;
  }

  grid.innerHTML = list.map((idea, i) => `
    <a class="idea-card" href="ideas/${idea.file}" style="animation-delay:${i*0.05}s">
      <div class="idea-card-title">${idea.title}</div>
      <div class="idea-card-meta">
        <span class="cat-badge">${idea.category}</span>
        <span>${formatDate(idea.date)}</span>
        ${idea.tags && idea.tags.length ? `<span>${idea.tags.map(t=>'#'+t).join(' ')}</span>` : ''}
      </div>
      <div class="idea-card-preview">${idea.content || ''}</div>
    </a>
  `).join('');
}

function renderCategories() {
  const list = document.getElementById('cat-list');
  const counts = {};
  allIdeas.forEach(i => { counts[i.category] = (counts[i.category]||0)+1; });

  list.innerHTML = `<div class="cat-item ${activeCategory==='all'?'active':''}" onclick="setCategory('all')">All (${allIdeas.length})</div>` +
    CATEGORIES.map(cat => `
      <div class="cat-item ${activeCategory===cat?'active':''}" onclick="setCategory('${cat}')">
        ${cat} ${counts[cat] ? `(${counts[cat]})` : ''}
      </div>
    `).join('');
}

function formatDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
}

// ── Modal helpers ──────────────────────────────────────────────
function openAddModal() {
  const cfg = getConfig();
  if (!cfg.token || !cfg.username || !cfg.repo) {
    openSettingsModal();
    showStatus('settings-status', 'Please fill in your GitHub settings first.', 'error');
    return;
  }
  document.getElementById('add-modal').classList.add('open');
}
function openSettingsModal() {
  const cfg = getConfig();
  document.getElementById('s-username').value = cfg.username;
  document.getElementById('s-repo').value     = cfg.repo;
  document.getElementById('s-branch').value   = cfg.branch;
  document.getElementById('s-token').value    = cfg.token;
  document.getElementById('settings-modal').classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if(e.target === m) m.classList.remove('open'); });
});

function showStatus(id, msg, type) {
  const el = document.getElementById(id);
  el.className = 'status-msg ' + type;
  el.textContent = msg;
}

// ── Submit idea to GitHub ──────────────────────────────────────
async function submitIdea() {
  const title   = document.getElementById('f-title').value.trim();
  const cat     = document.getElementById('f-category').value;
  const content = document.getElementById('f-content').value.trim();
  const tagsRaw = document.getElementById('f-tags').value.trim();

  if (!title || !content) {
    showStatus('add-status', 'Title and content are required.', 'error');
    return;
  }

  const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
  const date = new Date().toISOString();
  const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g,'');
  const filename = `${slug}-${Date.now()}.html`;

  showStatus('add-status', 'Saving to GitHub…', 'loading');

  const cfg = getConfig();

  try {
    // 1. Fetch template
    const templateRes = await fetch('ideas/template.html');
    const template = await templateRes.text();

    // 2. Build idea HTML
    const tagsHtml = tags.map(t => `<span class="tag">${t}</span>`).join('');
    const ideaHtml = template
      .replace(/{{TITLE}}/g,    title)
      .replace(/{{CATEGORY}}/g, cat)
      .replace(/{{DATE}}/g,     formatDate(date))
      .replace(/{{CONTENT}}/g,  content.replace(/</g,'&lt;').replace(/>/g,'&gt;'))
      .replace(/{{TAGS}}/g,     tagsHtml);

    // 3. Commit idea HTML
    await githubPut(cfg, `ideas/${filename}`, ideaHtml);

    // 4. Update manifest
    const newEntry = { title, category: cat, content: content.slice(0, 200), tags, date, file: filename };
    const updatedManifest = [newEntry, ...allIdeas];
    await githubPut(cfg, 'ideas/manifest.json', JSON.stringify(updatedManifest, null, 2));

    // 5. Update local state
    allIdeas = updatedManifest;
    renderIdeas();
    renderCategories();

    showStatus('add-status', '✓ Idea saved! It will appear on GitHub Pages shortly.', 'success');

    // Reset form
    ['f-title','f-content','f-tags'].forEach(id => document.getElementById(id).value = '');
    setTimeout(() => closeModal('add-modal'), 2000);

  } catch(err) {
    console.error(err);
    showStatus('add-status', `Error: ${err.message}`, 'error');
  }
}

async function githubPut(cfg, path, content) {
  const url = `https://api.github.com/repos/${cfg.username}/${cfg.repo}/contents/${path}`;

  // Check if file exists (to get SHA for update)
  let sha = null;
  try {
    const check = await fetch(url, {
      headers: {
        'Authorization': `token ${cfg.token}`,
        'Accept': 'application/vnd.github.v3+json',
      }
    });
    if (check.ok) {
      const data = await check.json();
      sha = data.sha;
    }
  } catch(e) {}

  const body = {
    message: `Add idea: ${path}`,
    content: btoa(unescape(encodeURIComponent(content))),
    branch:  cfg.branch,
  };
  if (sha) body.sha = sha;

  const res = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${cfg.token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });

  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || 'GitHub API error');
  }
  return res.json();
}

// ── Init ──────────────────────────────────────────────────────
loadIdeas();
</script>
